// XIRR calculation (Newton's method)
const xirr=(cashflows)=>{
  // cashflows: [{amount, date}] negative=investment, positive=redemption
  if(!cashflows||cashflows.length<2)return 0;
  const days=cashflows.map(cf=>daysBetween(cashflows[0].date,cf.date));
  let rate=0.1;
  for(let i=0;i<100;i++){
    let fv=0,dfv=0;
    for(let j=0;j<cashflows.length;j++){
      const t=days[j]/365;
      fv+=cashflows[j].amount*Math.pow(1+rate,-t);
      dfv+=-t*cashflows[j].amount*Math.pow(1+rate,-t-1);
    }
    if(Math.abs(dfv)<1e-10)break;
    const newRate=rate-fv/dfv;
    if(Math.abs(newRate-rate)<1e-7)return newRate*100;
    rate=newRate;
    if(rate<-0.99)rate=-0.99;
  }
  return rate*100;
};

function NWChart({history}){
  if(!history||history.length<2)return null;
  var data=history.slice(-90),vals=data.map(d=>d.nw),minV=Math.min(...vals),maxV=Math.max(...vals),range=maxV-minV||1,W=340,H=120,pY=10;

  var first=data[0],last=data[data.length-1],ch=last.nw-first.nw,chP=first.nw>0?((ch/first.nw)*100).toFixed(1):'0',up=ch>=0;

}
 
function AllocPie({segments}){
  if(!segments||!segments.length)return null;
  const total=segments.reduce((s,x)=>s+x.v,0);if(total<=0)return null;
  const colors=['#F2C94C','#22C55E','#3B82F6','#EF4444','#A855F7','#F97316','#06B6D4','#EC4899'];
  let cum=0;
  return(<div style={{background:'#0F0F0F',border:'1px solid #1C1C1C',borderRadius:'14px',padding:'14px',marginBottom:'10px'}}>
    <div style={{fontSize:'10px',fontWeight:800,color:'#F2C94C',letterSpacing:'2px',textTransform:'uppercase',marginBottom:'10px'}}>Asset Allocation</div>
    <div style={{display:'flex',gap:'12px',alignItems:'center'}}>
      <svg viewBox="0 0 36 36" style={{width:'100px',height:'100px',flexShrink:0}}>
        {segments.map((seg,i)=>{const pctVal=(seg.v/total)*100;const dash=pctVal;const offset=100-cum;cum+=pctVal;return<circle key={i} cx="18" cy="18" r="15.9" fill="none" stroke={colors[i%colors.length]} strokeWidth="3.5" strokeDasharray={dash+' '+(100-dash)} strokeDashoffset={offset} transform="rotate(-90 18 18)"/>;})}</svg>

}

            {docs.map(d=><div key={d.id} style={{padding:'6px 8px',background:'#141414',borderRadius:'6px',marginBottom:'3px'}}><div style={{display:'flex',justifyContent:'space-between'}}><div><div style={{fontSize:'11px',color:'#F2C94C'}}>{d.investmentName}</div><div style={{fontSize:'10px',color:'#3A3A3A'}}>{d.investmentType}{d.refNumber?' \u00B7 #'+d.refNumber:''}</div>{d.notes&&<div style={{fontSize:'10px',color:'#444'}}>{d.notes}</div>}</div><button style={rBtn} onClick={()=>uDocs(docs.filter(x=>x.id!==d.id))}>x</button></div></div>)}
            {!addingDoc?<button style={{...S.addBtn,background:'#141414',color:'#6A500A',border:'1px solid #6A500A33',fontSize:'11px'}} onClick={()=>setAddingDoc(true)}>+ Add Document</button>
            :<div style={{background:'#0D0B00',borderRadius:'8px',padding:'8px',marginTop:'4px',border:'1px solid #6A500A33'}}><Sel label="Type" value={newDoc.investmentType} onChange={e=>setNewDoc(p=>({...p,investmentType:e.target.value}))} options={['MF','Stock','FD','PPF','EPF','NPS','SGB','Insurance','Property','Loan']}/><Inp label="Name/Description" value={newDoc.investmentName} onChange={e=>setNewDoc(p=>({...p,investmentName:e.target.value}))} type="text" placeholder="HDFC Bluechip Fund"/><Inp label="Ref/Folio/Policy No" value={newDoc.refNumber} onChange={e=>setNewDoc(p=>({...p,refNumber:e.target.value}))} type="text" placeholder="123456789"/><Inp label="Notes" value={newDoc.notes} onChange={e=>setNewDoc(p=>({...p,notes:e.target.value}))} type="text" placeholder="For emergency fund, daughter's education..."/><div style={S.row2}><button style={{...S.addBtn,flex:1,marginTop:0}} onClick={()=>{if(!newDoc.investmentName)return;uDocs([...docs,{id:Date.now()+Math.random(),...newDoc}]);setNewDoc({investmentType:'',investmentName:'',refNumber:'',notes:''});setAddingDoc(false);}}>Save</button><button style={{...S.addBtn,flex:1,marginTop:0,background:'#1A1A1A',color:'#888'}} onClick={()=>setAddingDoc(false)}>Cancel</button></div></div>}
          </div>
 
          {/* Maturity Calendar */}
          <div style={S.card}><div style={S.ct}>Maturity Calendar (This Year)</div>
            {[...fds.map(fd=>({type:'FD',name:fd.bank,date:fd.maturityDate,val:fmt(calcFD(fd.principal,fd.rate,daysBetween(fd.startDate,fd.maturityDate),fd.compounding))})),
              ...(sgbMatDate&&new Date(sgbMatDate).getFullYear()===new Date().getFullYear()?[{type:'SGB',name:'Gold Bond',date:sgbMatDate,val:fmt(sgbVal())}]:[]),
              ...(ppf.startDate&&new Date(addYears(ppf.startDate,15)).getFullYear()===new Date().getFullYear()?[{type:'PPF',name:'PPF',date:addYears(ppf.startDate,15),val:fmt(f(ppf.balance))}]:[]),
              ...insurance.filter(i=>i.renewalDate&&new Date(i.renewalDate).getFullYear()===new Date().getFullYear()).map(i=>({type:'Insurance',name:i.insurer,date:i.renewalDate,val:'Renew'}))
            ].sort((a,b)=>new Date(a.date)-new Date(b.date)).map((item,i)=><div key={i} style={{display:'flex',justifyContent:'space-between',padding:'6px 0',borderBottom:'1px solid #141414'}}><div><span style={{fontSize:'11px',color:'#F2C94C'}}>{item.type}</span><span style={{fontSize:'10px',color:'#3A3A3A',marginLeft:'6px'}}>{item.name}</span></div><div style={{textAlign:'right'}}><div style={{fontSize:'10px',color:'#888'}}>{fmtDate(item.date)}</div><div style={{fontSize:'11px',color:'#F2C94C'}}>{item.val}</div></div></div>)}
            {fds.length===0&&!sgbMatDate&&insurance.length===0&&<div style={{fontSize:'11px',color:'#3A3A3A',textAlign:'center',padding:'12px'}}>No maturities this year</div>}
          </div>
        </div>}
      </div>}
 
      {tab==='tax'&&<div style={S.pg}>
        <div style={S.cardG}><div style={{fontSize:'10px',color:'#6A500A',textTransform:'uppercase',letterSpacing:'1.5px'}}>New Regime | Slab: {slabRate()}% | Income: {fmt(latestIncome)}</div></div>
 
        {/* Equity LTCG */}
        {(mfVal>0||stVal>0)&&(()=>{var ltcg=mfHoldings.filter(h=>h.type==='equity').reduce((s,h)=>s+Math.max(0,h.units*(h.currentNav||0)-h.units*(h.avgNav||0)),0)+stocks.reduce((s,h)=>s+Math.max(0,h.qty*(h.currentPrice||0)-h.qty*(h.avgPrice||0)),0),taxable=Math.max(0,ltcg-125000),tax=taxable*0.125;return<div style={S.card}><div style={S.ct}>Equity LTCG</div><Dr label="Gains" val={fmt(ltcg)}/><Dr label="Exempt" val={'\u20B91.25L'} color="#22C55E"/><Dr label="Taxable" val={fmt(taxable)} color={taxable>0?'#EF4444':'#22C55E'}/><Dr label="Tax @12.5%" val={fmt(tax)} color={tax>0?'#EF4444':'#22C55E'}/>{ltcg>0&&ltcg<125000&&<InfoBox color="#22C55E" bg="#050F05">Book {fmt(125000-ltcg)} more before March 31 \u2014 tax-free!</InfoBox>}</div>;})()}
 
        {/* Crypto */}
        {cryptoVal>0&&<div style={S.card}><div style={S.ct}>Crypto Tax</div><Dr label="Gains" val={fmt(Math.max(0,cryptoVal-cryptoCost))}/><Dr label="Tax @30% flat" val={fmt(Math.max(0,cryptoVal-cryptoCost)*0.3)} color="#EF4444"/><InfoBox>Flat 30% + 4% cess. No deductions except cost. 1% TDS on transfers above \u20B910K.</InfoBox></div>}
 
        {/* 80D */}
        {insurance.length>0&&<div style={S.card}><div style={S.ct}>80D \u2014 Health Insurance</div><Dr label="Premium Paid" val={fmt(totalInsurancePremium)}/><Dr label="Limit (self/family)" val={'\u20B925,000'}/><Dr label="Used" val={fmt(Math.min(25000,totalInsurancePremium))} color="#22C55E"/><Dr label="Remaining" val={fmt(Math.max(0,25000-totalInsurancePremium))} color={totalInsurancePremium>=25000?'#888':'#F2C94C'}/></div>}
 
        {/* Section 24 */}
        {debts.some(d=>d.type==='homeloan')&&<div style={S.card}><div style={S.ct}>Section 24 \u2014 Home Loan Interest</div>{debts.filter(d=>d.type==='homeloan').map(d=>{var annualInt=f(d.outstanding)*f(d.interestRate)/100;return<div key={d.id+d.name}><Dr label={d.name} val={fmt(annualInt)+'/yr'}/><Dr label="Deductible (self-occ)" val={fmt(Math.min(200000,annualInt))} color="#22C55E"/></div>})}</div>}
 
        {/* Capital Gains Register */}
        <div style={S.card}><div style={S.ct}>Capital Gains Register</div>
          {capitalGains.map(cg=><div key={cg.id} style={{padding:'6px 8px',background:'#141414',borderRadius:'6px',marginBottom:'3px'}}><div style={{display:'flex',justifyContent:'space-between'}}><div><div style={{fontSize:'11px',color:'#F2C94C'}}>{cg.asset}</div><div style={{fontSize:'10px',color:'#3A3A3A'}}>{fmtDate(cg.date)} \u00B7 {f(cg.holdingDays)>365?'LTCG':'STCG'}</div></div><div style={{textAlign:'right'}}><div style={{fontSize:'11px',fontWeight:700,color:gc(f(cg.sellPrice)*f(cg.qty),f(cg.buyPrice)*f(cg.qty))}}>{fmt((f(cg.sellPrice)-f(cg.buyPrice))*f(cg.qty))}</div></div></div><button style={rBtn} onClick={()=>uCG(capitalGains.filter(x=>x.id!==cg.id))}>x</button></div>)}
          {!addingCG?<button style={{...S.addBtn,background:'#141414',color:'#6A500A',border:'1px solid #6A500A33',fontSize:'11px'}} onClick={()=>setAddingCG(true)}>+ Log Sale</button>
          :<div style={{background:'#0D0B00',borderRadius:'8px',padding:'8px',marginTop:'4px',border:'1px solid #6A500A33'}}><Inp label="Asset" value={newCG.asset} onChange={e=>setNewCG(p=>({...p,asset:e.target.value}))} type="text" placeholder="RELIANCE, SBI MF..."/><div style={S.row2}><div style={{flex:1}}><div style={_lblS}>Sale Date</div><input style={_inpS} type="date" value={newCG.date} onChange={e=>setNewCG(p=>({...p,date:e.target.value}))}/></div><div style={{flex:1}}><Inp label="Holding Days" value={newCG.holdingDays} onChange={e=>setNewCG(p=>({...p,holdingDays:e.target.value}))}/></div></div><div style={S.row2}><div style={{flex:1}}><Inp label="Buy Price/unit" value={newCG.buyPrice} onChange={e=>setNewCG(p=>({...p,buyPrice:e.target.value}))}/></div><div style={{flex:1}}><Inp label="Sell Price/unit" value={newCG.sellPrice} onChange={e=>setNewCG(p=>({...p,sellPrice:e.target.value}))}/></div></div><Inp label="Qty" value={newCG.qty} onChange={e=>setNewCG(p=>({...p,qty:e.target.value}))}/><div style={S.row2}><button style={{...S.addBtn,flex:1,marginTop:0}} onClick={()=>{if(!newCG.asset)return;uCG([...capitalGains,{id:Date.now()+Math.random(),...newCG}]);setNewCG({date:'',asset:'',type:'equity',buyPrice:'',sellPrice:'',qty:'',holdingDays:''});setAddingCG(false);}}>Log</button><button style={{...S.addBtn,flex:1,marginTop:0,background:'#1A1A1A',color:'#888'}} onClick={()=>setAddingCG(false)}>Cancel</button></div></div>}
        </div>
 
        {/* Advance Tax */}
        <div style={S.card}><div style={S.ct}>Advance Tax Calendar</div>
          {[['Jun 15','15% of tax'],['Sep 15','45% cumulative'],['Dec 15','75% cumulative'],['Mar 15','100% cumulative']].map(([d,p])=><Dr key={d} label={d} val={p} color="#888"/>)}
        </div>
 
        <div style={S.card}><div style={S.ct}>Tips</div>{[['Harvest \u20B91.25L LTCG','Sell & rebuy before Mar 31. Tax-free.'],['SGB 8yr hold','Zero CG tax for original subscribers.'],['EPF 5yr rule','TDS 10% if withdrawn early.'],['NPS \u20B950K extra','80CCD(1B) old regime only.'],['PPF EEE','Contribute, interest, maturity \u2014 all tax-free.'],['ITR by Jul 31','Losses expire without filing.']].map(p=><div key={p[0]} style={{marginBottom:'6px',paddingBottom:'6px',borderBottom:'1px solid #141414'}}><div style={{fontSize:'11px',fontWeight:700,color:'#F2C94C'}}>{p[0]}</div><div style={{fontSize:'10px',color:'#444'}}>{p[1]}</div></div>)}</div>
      </div>}
 
      <div style={S.nav}>{TABS.map(t=><div key={t.k} style={S.ni(tab===t.k)} onClick={()=>{setTab(t.k);setSubTab(t.k==='assets'?'metals':t.k==='insights'?'alloc':'overview');}}><span style={{fontSize:'18px'}}>{t.i}</span><span style={S.nl(tab===t.k)}>{t.l}</span></div>)}</div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<WealthApp/>);
</script>
</body>
</html>
