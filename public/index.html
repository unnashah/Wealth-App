<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#080808;font-family:system-ui,sans-serif;-webkit-tap-highlight-color:transparent}input,button,textarea,select{font-family:inherit}::-webkit-scrollbar{display:none}</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>

</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef} = React;
 
const fmt=(n)=>{if(!n&&n!==0)return'\u2014';const num=parseFloat(n);if(isNaN(num))return'\u2014';if(num>=10000000)return'\u20B9'+(num/10000000).toFixed(2)+'Cr';if(num>=100000)return'\u20B9'+(num/100000).toFixed(2)+'L';if(num>=1000)return'\u20B9'+(num/1000).toFixed(1)+'K';return'\u20B9'+num.toFixed(0);};
const f=(n)=>parseFloat(n)||0;
const pct=(c,b)=>b>0?(((c-b)/b)*100).toFixed(1):'0.0';
const gc=(c,b)=>c>=b?'#22C55E':'#EF4444';
const daysBetween=(a,b)=>Math.floor((new Date(b)-new Date(a))/86400000);
const daysLeft=(d)=>daysBetween(new Date().toISOString().split('T')[0],d);
const daysHeld=(d)=>daysBetween(d,new Date().toISOString().split('T')[0]);
const fmtDate=(d)=>d?new Date(d).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}):'\u2014';
const calcFD=(p,r,days,freq=4)=>f(p)*Math.pow(1+f(r)/100/freq,freq*days/365);
const todayStr=()=>new Date().toISOString().split('T')[0];
const load=(key,fb)=>{try{const v=localStorage.getItem(key);return v?JSON.parse(v):fb;}catch{return fb;}};
const save=(key,val)=>{try{localStorage.setItem(key,JSON.stringify(val));}catch{}};
const addYears=(d,y)=>{const dt=new Date(d);dt.setFullYear(dt.getFullYear()+y);return dt.toISOString().split('T')[0];};
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
 
function PinScreen({onUnlock}){
  const storedPin=load('w_pin',null);
  const [mode]=useState(storedPin?'enter':'setup');
  const [pin,setPin]=useState('');
  const [confirmPin,setConfirmPin]=useState('');
  const [error,setError]=useState('');
  const [step,setStep]=useState(1);
  const handleKey=(digit)=>{setError('');
    if(mode==='enter'){const n=pin+digit;setPin(n);if(n.length===4){if(n===storedPin)onUnlock();else{setError('Wrong PIN');setPin('');}}}
    else{if(step===1){const n=pin+digit;setPin(n);if(n.length===4){setStep(2);setConfirmPin('');}}else{const n=confirmPin+digit;setConfirmPin(n);if(n.length===4){if(n===pin){save('w_pin',pin);onUnlock();}else{setError("PINs don't match");setPin('');setConfirmPin('');setStep(1);}}}}
  };
  const handleDel=()=>{setError('');if(mode==='enter')setPin(pin.slice(0,-1));else if(step===1)setPin(pin.slice(0,-1));else setConfirmPin(confirmPin.slice(0,-1));};
  const cur=mode==='enter'?pin:(step===1?pin:confirmPin);
  const title=mode==='enter'?'Enter PIN':(step===1?'Set a 4-digit PIN':'Confirm PIN');
  return(
    <div style={{background:'#080808',minHeight:'100vh',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',maxWidth:'400px',margin:'0 auto',padding:'20px'}}>
      <div style={{fontSize:'40px',marginBottom:'16px'}}>{'\uD83D\uDC8E'}</div>
      <div style={{fontSize:'18px',fontWeight:800,color:'#F2C94C',marginBottom:'6px'}}>Wealth Dashboard</div>
      <div style={{fontSize:'13px',color:'#6A500A',marginBottom:'28px'}}>{title}</div>
      <div style={{display:'flex',gap:'14px',marginBottom:'8px'}}>{[0,1,2,3].map(i=><div key={i} style={{width:'16px',height:'16px',borderRadius:'50%',border:'2px solid #6A500A',background:i<cur.length?'#F2C94C':'transparent'}}/>)}</div>
      {error?<div style={{fontSize:'12px',color:'#EF4444',height:'26px',lineHeight:'26px'}}>{error}</div>:<div style={{height:'26px'}}/>}
      <div style={{display:'grid',gridTemplateColumns:'repeat(3,72px)',gap:'10px',marginTop:'8px'}}>
        {[1,2,3,4,5,6,7,8,9,'',0,'\u232B'].map(k=>{if(k==='')return<div key="e"/>;return<button key={k} onClick={()=>k==='\u232B'?handleDel():handleKey(String(k))} style={{width:'72px',height:'56px',borderRadius:'12px',border:'none',fontSize:k==='\u232B'?'20px':'22px',fontWeight:700,cursor:'pointer',background:k==='\u232B'?'transparent':'#141414',color:k==='\u232B'?'#6A500A':'#F2C94C'}}>{k}</button>;})}
      </div>
      {mode==='enter'&&<button onClick={()=>{if(confirm('Erase PIN and ALL data?')){localStorage.clear();location.reload();}}} style={{marginTop:'32px',background:'none',border:'none',color:'#2A2A2A',fontSize:'10px',cursor:'pointer'}}>Forgot PIN? Reset everything</button>}
    </div>
  );
}
 
function NWChart({history}){
  if(!history||history.length<2)return null;
  var data=history.slice(-30),vals=data.map(d=>d.nw),minV=Math.min(...vals),maxV=Math.max(...vals),range=maxV-minV||1,W=340,H=120,pY=10;
  var pts=data.map((d,i)=>{var x=(i/(data.length-1))*W;var y=H-pY-((d.nw-minV)/range)*(H-pY*2);return x+','+y;}).join(' ');
  var first=data[0],last=data[data.length-1],ch=last.nw-first.nw,chP=first.nw>0?((ch/first.nw)*100).toFixed(1):'0',up=ch>=0;
  return(<div style={{background:'#0F0F0F',border:'1px solid #1C1C1C',borderRadius:'14px',padding:'14px',marginBottom:'10px'}}>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'10px'}}><div style={{fontSize:'10px',fontWeight:800,color:'#F2C94C',letterSpacing:'2px',textTransform:'uppercase'}}>Net Worth Trend</div><div style={{fontSize:'11px',fontWeight:700,color:up?'#22C55E':'#EF4444'}}>{up?'+':''}{fmt(ch)} ({chP}%)</div></div>
    <svg viewBox={'0 0 '+W+' '+H} style={{width:'100%',height:'120px'}}><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={up?'#22C55E':'#EF4444'} stopOpacity="0.3"/><stop offset="100%" stopColor={up?'#22C55E':'#EF4444'} stopOpacity="0"/></linearGradient></defs><polygon points={'0,'+(H-pY)+' '+pts+' '+W+','+(H-pY)} fill="url(#g)"/><polyline points={pts} fill="none" stroke={up?'#22C55E':'#EF4444'} strokeWidth="2" strokeLinejoin="round"/></svg>
    <div style={{display:'flex',justifyContent:'space-between',marginTop:'4px'}}><span style={{fontSize:'9px',color:'#3A3A3A'}}>{first.date}</span><span style={{fontSize:'9px',color:'#3A3A3A'}}>{last.date}</span></div>
  </div>);
}
 
const _drS={display:'flex',justifyContent:'space-between',alignItems:'center',padding:'6px 0',borderBottom:'1px solid #141414'};
const _lblS={fontSize:'10px',fontWeight:600,color:'#3A3A3A',textTransform:'uppercase',letterSpacing:'1px',marginBottom:'4px'};
const _inpS={width:'100%',background:'#141414',border:'1px solid #222',borderRadius:'8px',padding:'9px 11px',fontSize:'14px',color:'#F2C94C',outline:'none',boxSizing:'border-box',fontFamily:'inherit'};
 
function Dr({label,val,color,bold}){return<div style={_drS}><span style={{fontSize:'12px',color:'#555'}}>{label}</span><span style={{fontSize:'12px',fontWeight:bold?800:600,color:color||'#F2C94C'}}>{val}</span></div>;}
function Inp({label,value,onChange,type='number',placeholder='0'}){return<div style={{marginBottom:'8px'}}><div style={_lblS}>{label}</div><input style={_inpS} type={type} placeholder={placeholder} value={value} onChange={onChange}/></div>;}
function Sel({label,value,onChange,options}){return<div style={{marginBottom:'8px'}}><div style={_lblS}>{label}</div><select style={{..._inpS,fontSize:'12px'}} value={value} onChange={onChange}><option value="">Select</option>{options.map(o=><option key={o} value={o}>{o}</option>)}</select></div>;}
function InfoBox({color='#6A500A',bg='#0D0B00',children}){return<div style={{fontSize:'11px',color,padding:'8px',background:bg,borderRadius:'8px',marginTop:'6px',lineHeight:1.6}}>{children}</div>;}
 
function WealthApp(){
  const [locked,setLocked]=useState(()=>!!load('w_pin',null));
  const [tab,setTab]=useState('home');
  const [subTab,setSubTab]=useState('portfolio');
  const [refreshing,setRefreshing]=useState(false);
  const [showSettings,setShowSettings]=useState(false);
 
  // Prices
  const [prices,setPrices]=useState(()=>load('w_prices',{gold24k:9500,gold22k:8700,gold18k:7125,silver:105,updated:null}));
  const [editingPrices,setEditingPrices]=useState(false);
  const [tempPrices,setTempPrices]=useState({});
 
  // Metal Items (individual pieces)
  const [metalItems,setMetalItems]=useState(()=>load('w_metalItems',[]));
  const [addingMetalCat,setAddingMetalCat]=useState(null);
  const [newMetalItem,setNewMetalItem]=useState({desc:'',weight:'',value:'',cost:''});
  const [editingMetalId,setEditingMetalId]=useState(null);
 
  // SGB
  const [sgb,setSgb]=useState(()=>load('w_sgb',{grams:'',purchasePrice:'',purchaseType:'primary',purchaseDate:''}));
 
  // Govt schemes
  const [ppf,setPpf]=useState(()=>load('w_ppf',{balance:'',monthlyContrib:'',startDate:'',interestRate:'7.1'}));
  const [nps,setNps]=useState(()=>load('w_nps',{balance:'',monthlyContrib:'',employerContrib:'',age:'',startDate:''}));
  const [epf,setEpf]=useState(()=>load('w_epf',{balance:'',monthlyContrib:'',employerContrib:'',serviceYears:'',interestRate:'8.25'}));
 
  // Tax
  const [taxProfile,setTaxProfile]=useState(()=>load('w_tax',{regime:'new',entries:[]}));
  const [addingIncome,setAddingIncome]=useState(false);
  const [newIncome,setNewIncome]=useState({month:'',year:'',income:''});
  const [editingIncomeId,setEditingIncomeId]=useState(null);
 
  // Crypto
  const [crypto,setCrypto]=useState(()=>load('w_crypto',[]));
  const [addingCrypto,setAddingCrypto]=useState(false);
  const [newCrypto,setNewCrypto]=useState({coin:'bitcoin',symbol:'BTC',qty:'',buyPrice:''});
  const [editingCryptoId,setEditingCryptoId]=useState(null);
 
  // MF
  const [mfHoldings,setMfHoldings]=useState(()=>load('w_mf',[]));
  const [addingMf,setAddingMf]=useState(false);
  const [newMf,setNewMf]=useState({schemeCode:'',schemeName:'',units:'',avgNav:'',type:'equity'});
  const [editingMfId,setEditingMfId]=useState(null);
  const [mfSearch,setMfSearch]=useState('');
  const [mfResults,setMfResults]=useState([]);
  const [searching,setSearching]=useState(false);
  const [linkingMfId,setLinkingMfId]=useState(null);
  const [linkSearch,setLinkSearch]=useState('');
  const [linkResults,setLinkResults]=useState([]);
 
  // SIPs
  const [sips,setSips]=useState(()=>load('w_sips',[]));
  const [addingSip,setAddingSip]=useState(false);
  const [newSip,setNewSip]=useState({name:'',amount:'',debitDate:'',startDate:'',frequency:'monthly',units:'',status:'active'});
  const [editingSipId,setEditingSipId]=useState(null);
 
  // Stocks
  const [stocks,setStocks]=useState(()=>load('w_stocks',[]));
  const [addingStock,setAddingStock]=useState(false);
  const [newStock,setNewStock]=useState({symbol:'',name:'',qty:'',avgPrice:''});
  const [editingStockId,setEditingStockId]=useState(null);
  const [loadingStocks,setLoadingStocks]=useState(false);
  const [stockSearch,setStockSearch]=useState('');
  const [stockResults,setStockResults]=useState([]);
 
  // FDs
  const [fds,setFds]=useState(()=>load('w_fds',[]));
  const [addingFd,setAddingFd]=useState(false);
  const [fdForm,setFdForm]=useState({bank:'',principal:'',rate:'',startDate:'',maturityDate:'',tenureMonths:'',compounding:'4'});
  const [selectedFd,setSelectedFd]=useState(null);
  const [editingFdId,setEditingFdId]=useState(null);
  const [wdDate,setWdDate]=useState('');
  const [penalty,setPenalty]=useState('1');
 
  // Debt
  const [debts,setDebts]=useState(()=>load('w_debts',[]));
  const [addingDebt,setAddingDebt]=useState(false);
  const [newDebt,setNewDebt]=useState({type:'homeloan',name:'',originalAmount:'',outstanding:'',interestRate:'',emi:'',tenureMonths:'',startDate:'',notes:''});
  const [editingDebtId,setEditingDebtId]=useState(null);
 
  // Import
  const [importPreview,setImportPreview]=useState(null);
  const stockFileRef=useRef(null);
  const mfFileRef=useRef(null);
 
  // History
  const [nwHistory,setNwHistory]=useState(()=>load('w_nwhistory',[]));
  const didAutoRefresh=useRef(false);
 
  // Save helpers
  const saveTimers=useRef({});
  const dSave=(key,val)=>{clearTimeout(saveTimers.current[key]);saveTimers.current[key]=setTimeout(()=>save(key,val),500);};
  const uPrices=(p)=>{setPrices(p);save('w_prices',p);};
  const uMetalItems=(v)=>{setMetalItems(v);save('w_metalItems',v);};
  const uSgb=(v)=>{setSgb(v);dSave('w_sgb',v);};
  const uPpf=(v)=>{setPpf(v);dSave('w_ppf',v);};
  const uNps=(v)=>{setNps(v);dSave('w_nps',v);};
  const uEpf=(v)=>{setEpf(v);dSave('w_epf',v);};
  const uTax=(v)=>{setTaxProfile(v);save('w_tax',v);};
  const uCrypto=(v)=>{setCrypto(v);save('w_crypto',v);};
  const uMf=(v)=>{setMfHoldings(v);save('w_mf',v);};
  const uSips=(v)=>{setSips(v);save('w_sips',v);};
  const uStocks=(v)=>{setStocks(v);save('w_stocks',v);};
  const uFds=(v)=>{setFds(v);save('w_fds',v);};
  const uDebts=(v)=>{setDebts(v);save('w_debts',v);};
 
  // Edit helper: opens form pre-filled, saves update
  const startEdit=(item,setEditing,setForm,formFields)=>{setEditing(item.id);const obj={};formFields.forEach(k=>{obj[k]=item[k]||'';});setForm(obj);};
 
  // APIs
  const fetchNAV=async(code)=>{if(!code)return null;try{const r=await fetch('https://api.mfapi.in/mf/'+code+'/latest');const d=await r.json();if(d&&d.data&&d.data[0])return{nav:parseFloat(d.data[0].nav),date:d.data[0].date};}catch{}return null;};
  const searchMFn=async(q)=>{if(!q||q.length<2){setMfResults([]);return;}setSearching(true);try{const r=await fetch('https://api.mfapi.in/mf/search?q='+encodeURIComponent(q));const d=await r.json();setMfResults((Array.isArray(d)?d:[]).slice(0,7));}catch{setMfResults([]);}setSearching(false);};
  const fetchSP=async(list)=>{if(!list.length)return list;try{const sym=list.map(s=>s.symbol).join(',');const r=await fetch('/api/stocks?symbols='+encodeURIComponent(sym));const arr=await r.json();if(Array.isArray(arr)){const m={};arr.forEach(p=>{if(p.symbol)m[p.symbol.toUpperCase()]=p;});return list.map(s=>{const fd=m[s.symbol.toUpperCase()];return fd&&fd.price?{...s,currentPrice:fd.price,change:fd.change}:s;});}}catch{}return list;};
  const fetchCryptoPrices=async(list)=>{if(!list.length)return list;try{const ids=list.map(c=>c.coin).join(',');const r=await fetch('https://api.coingecko.com/api/v3/simple/price?ids='+encodeURIComponent(ids)+'&vs_currencies=inr&include_24hr_change=true');const d=await r.json();return list.map(c=>{const p=d[c.coin];return p?{...c,priceINR:p.inr,change24h:p.inr_24h_change}:c;});}catch{}return list;};
  const searchStockFn=async(q)=>{if(!q||q.length<2){setStockResults([]);return;}try{const r=await fetch('/api/stocks?symbols='+encodeURIComponent(q));const arr=await r.json();if(Array.isArray(arr))setStockResults(arr.filter(s=>s.price).slice(0,5));else setStockResults([]);}catch{setStockResults([]);}};
 
  // Import
  const parseFile=(file,cb)=>{const reader=new FileReader();reader.onload=(e)=>{try{const wb=XLSX.read(e.target.result,{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];const rows=XLSX.utils.sheet_to_json(ws,{defval:''});cb(rows);}catch(err){alert('Could not read file: '+err.message);}};reader.readAsArrayBuffer(file);};
  const findCol=(row,candidates)=>{const keys=Object.keys(row);for(const c of candidates){const found=keys.find(k=>k.toLowerCase().replace(/[^a-z0-9]/g,'').includes(c.toLowerCase().replace(/[^a-z0-9]/g,'')));if(found)return found;}return null;};
  const importStocks=(file)=>{parseFile(file,(rows)=>{if(!rows.length){alert('No data');return;}const symCol=findCol(rows[0],['instrument','symbol','stock','trading symbol','scrip','name']);const qtyCol=findCol(rows[0],['qty','quantity','shares','units']);const avgCol=findCol(rows[0],['avg cost','avg price','average cost','average price','buy avg','cost price','buy price']);if(!symCol||!qtyCol){alert('Could not find columns. Found: '+Object.keys(rows[0]).join(', '));return;}const parsed=rows.filter(r=>r[symCol]&&f(r[qtyCol])>0).map(r=>({id:Date.now()+Math.random(),symbol:String(r[symCol]).replace(/-.*$/,'').replace(/\s+/g,'').toUpperCase(),name:String(r[symCol]).replace(/-.*$/,'').trim(),qty:f(r[qtyCol]),avgPrice:avgCol?f(r[avgCol]):0,currentPrice:null,change:null}));if(!parsed.length){alert('No valid rows');return;}setImportPreview({type:'stocks',data:parsed});});};
  const importMF=(file)=>{parseFile(file,(rows)=>{if(!rows.length){alert('No data');return;}const nameCol=findCol(rows[0],['scheme','fund name','fund','scheme name']);const unitsCol=findCol(rows[0],['units','unit','quantity']);const navCol=findCol(rows[0],['avg nav','avg cost','average nav','invested nav','purchase nav','cost price']);if(!nameCol||!unitsCol){alert('Could not find columns. Found: '+Object.keys(rows[0]).join(', '));return;}const parsed=rows.filter(r=>r[nameCol]&&f(r[unitsCol])>0).map(r=>({id:Date.now()+Math.random(),schemeCode:'',schemeName:String(r[nameCol]).trim(),units:f(r[unitsCol]),avgNav:navCol?f(r[navCol]):0,type:'equity',currentNav:null,navDate:null}));if(!parsed.length){alert('No valid rows');return;}setImportPreview({type:'funds',data:parsed});});};
  const confirmImport=async()=>{if(!importPreview)return;if(importPreview.type==='stocks'){const merged=[...stocks,...importPreview.data];const updated=await fetchSP(merged);uStocks(updated);}else{uMf([...mfHoldings,...importPreview.data]);}setImportPreview(null);};
 
  // Computed values
  const catRate=(cat)=>cat==='gold24k'?prices.gold24k:cat==='gold22k'?prices.gold22k:cat==='gold18k'?prices.gold18k:cat==='goldJewellery'?prices.gold22k:cat==='silver'||cat==='silverArticles'?prices.silver:0;
  const catTotal=(cat)=>metalItems.filter(i=>i.category===cat).reduce((s,i)=>cat==='diamond'?s+f(i.value):s+f(i.weight)*(catRate(cat)||0),0);
  const catWeight=(cat)=>metalItems.filter(i=>i.category===cat).reduce((s,i)=>s+f(i.weight),0);
  const catCost=(cat)=>metalItems.filter(i=>i.category===cat).reduce((s,i)=>s+f(i.cost),0);
  const metalVal=()=>metalItems.reduce((s,i)=>i.category==='diamond'?s+f(i.value):s+f(i.weight)*(catRate(i.category)||0),0);
  const sgbVal=()=>f(sgb.grams)*(prices.gold24k||0);
  const sgbMatDate=sgb.purchaseDate?addYears(sgb.purchaseDate,8):'';
  const sgbYrs=sgb.purchaseDate?(new Date()-new Date(sgb.purchaseDate))/(365.25*864e5):0;
  const sgbInterestEarned=f(sgb.purchasePrice)*f(sgb.grams)*0.025*sgbYrs;
  const cryptoVal=crypto.reduce((s,c)=>s+f(c.qty)*(c.priceINR||0),0);
  const cryptoCost=crypto.reduce((s,c)=>s+f(c.qty)*f(c.buyPrice),0);
  const mfVal=mfHoldings.reduce((s,h)=>s+h.units*(h.currentNav||0),0);
  const mfCost=mfHoldings.reduce((s,h)=>s+h.units*(h.avgNav||0),0);
  const stVal=stocks.reduce((s,h)=>s+h.qty*(h.currentPrice||0),0);
  const stCost=stocks.reduce((s,h)=>s+h.qty*(h.avgPrice||0),0);
  const fdVal=fds.reduce((s,fd)=>{var held=Math.max(0,daysHeld(fd.startDate));return s+calcFD(fd.principal,fd.rate,held,fd.compounding);},0);
  const fdMatVal=fds.reduce((s,fd)=>s+calcFD(fd.principal,fd.rate,daysBetween(fd.startDate,fd.maturityDate),fd.compounding),0);
  const totalDebt=debts.reduce((s,d)=>s+f(d.outstanding),0);
  const totalAssets=metalVal()+sgbVal()+f(ppf.balance)+f(nps.balance)+f(epf.balance)+mfVal+stVal+cryptoVal+fdVal;
  const totalNW=()=>totalAssets-totalDebt;
  const latestIncome=taxProfile.entries&&taxProfile.entries.length>0?f(taxProfile.entries[taxProfile.entries.length-1].income):0;
  const slabRate=()=>{const i=latestIncome;if(taxProfile.regime==='new'){if(i<=400000)return 0;if(i<=800000)return 5;if(i<=1200000)return 10;if(i<=1600000)return 15;if(i<=2000000)return 20;if(i<=2400000)return 25;return 30;}if(i<=250000)return 0;if(i<=500000)return 5;if(i<=1000000)return 20;return 30;};
 
  // Snapshot & Refresh
  const saveSnapshot=(nw)=>{var t=todayStr();var h=load('w_nwhistory',[]);var l=h.length>0?h[h.length-1]:null;if(l&&l.dk===t)h[h.length-1]={dk:t,date:new Date().toLocaleDateString('en-IN',{day:'numeric',month:'short'}),nw};else h.push({dk:t,date:new Date().toLocaleDateString('en-IN',{day:'numeric',month:'short'}),nw});if(h.length>90)h=h.slice(-90);save('w_nwhistory',h);setNwHistory(h);};

  const exportCSV=()=>{var rows=[['Category','Item','Qty','Cost','Value']];metalItems.forEach(i=>rows.push(['Metal',i.category+(i.desc?' - '+i.desc:''),i.category==='diamond'?'':i.weight+'g',i.cost||'',i.category==='diamond'?String(f(i.value)):String(f(i.weight)*(catRate(i.category)||0))]));if(sgb.grams)rows.push(['SGB','Gold Bond',sgb.grams+'g',String(f(sgb.purchasePrice)*f(sgb.grams)),String(sgbVal())]);if(ppf.balance)rows.push(['PPF','','','',ppf.balance]);if(nps.balance)rows.push(['NPS','','','',nps.balance]);if(epf.balance)rows.push(['EPF','','','',epf.balance]);crypto.forEach(c=>rows.push(['Crypto',c.symbol,String(c.qty),String(f(c.qty)*f(c.buyPrice)),String(f(c.qty)*(c.priceINR||0))]));mfHoldings.forEach(h=>rows.push(['MF',h.schemeName,String(h.units),String(h.units*h.avgNav),String(h.units*(h.currentNav||0))]));sips.forEach(s=>rows.push(['SIP',s.name,s.units||'','\u20B9'+s.amount+'/'+s.frequency,s.status]));stocks.forEach(h=>rows.push(['Stock',h.symbol,String(h.qty),String(h.qty*h.avgPrice),String(h.qty*(h.currentPrice||0))]));fds.forEach(fd=>rows.push(['FD',fd.bank,fd.rate+'%',String(fd.principal),String(calcFD(fd.principal,fd.rate,daysBetween(fd.startDate,fd.maturityDate),fd.compounding))]));debts.forEach(d=>rows.push(['Debt',d.name,d.type,'','-'+d.outstanding]));rows.push([]);rows.push(['TOTAL ASSETS','','','',String(totalAssets)]);rows.push(['TOTAL DEBT','','','','-'+String(totalDebt)]);rows.push(['NET WORTH','','','',String(totalNW())]);var csv=rows.map(r=>r.map(c=>'"'+String(c||'').replace(/"/g,'""')+'"').join(',')).join('\n');var blob=new Blob([csv],{type:'text/csv'});var u=URL.createObjectURL(blob);var a=document.createElement('a');a.href=u;a.download='wealth_'+todayStr()+'.csv';a.click();URL.revokeObjectURL(u);};

          :<div>
            {fds.length>0&&<div style={S.cardG}><div style={{display:'flex'}}>{[['Invested',fmt(fds.reduce((s,fd)=>s+fd.principal,0))],['Today',fmt(fdVal)],['At Maturity',fmt(fdMatVal)]].map((p,i)=><div key={p[0]} style={{flex:1,textAlign:'center',borderRight:i<2?'1px solid #2A2A1A':'none'}}><div style={{fontSize:'9px',color:'#6A500A',textTransform:'uppercase'}}>{p[0]}</div><div style={{fontSize:'14px',fontWeight:800,color:'#F2C94C'}}>{p[1]}</div></div>)}</div></div>}
            {fds.map(fd=>{var td=daysBetween(fd.startDate,fd.maturityDate),left=daysLeft(fd.maturityDate),held=daysHeld(fd.startDate),mat=calcFD(fd.principal,fd.rate,td,fd.compounding),curVal=calcFD(fd.principal,fd.rate,Math.max(0,held),fd.compounding),prog=Math.min(100,Math.max(0,(held/td)*100)),isMat=left<=0;return<div key={fd.id} style={{background:'#141414',border:'1px solid #1C1C1C',borderRadius:'12px',padding:'13px',marginBottom:'8px',cursor:'pointer'}} onClick={()=>{setSelectedFd(fd);setWdDate('');setPenalty('1');}}><div style={{display:'flex',justifyContent:'space-between',marginBottom:'6px'}}><div><div style={{fontSize:'14px',fontWeight:800,color:'#F2C94C'}}>{fd.bank}</div><div style={{fontSize:'11px',color:'#3A3A3A'}}>{fd.rate}% {fmt(fd.principal)}</div></div><div style={{textAlign:'right'}}><div style={{fontSize:'14px',fontWeight:800,color:'#F2C94C'}}>{fmt(isMat?mat:curVal)}</div><div style={{fontSize:'9px',color:'#6A500A'}}>{isMat?'Matured':'Today'}</div>{!isMat&&<div style={{fontSize:'10px',color:'#22C55E'}}>Mat: {fmt(mat)}</div>}</div></div>{!isMat&&<div style={{height:'3px',background:'#1A1A1A',borderRadius:'2px'}}><div style={{height:'100%',width:prog+'%',background:'#22C55E',borderRadius:'2px',opacity:0.7}}/></div>}<div style={{display:'flex',justifyContent:'space-between',marginTop:'4px'}}><span style={{fontSize:'10px',color:'#3A3A3A'}}>{fmtDate(fd.maturityDate)}</span><span style={{fontSize:'10px',color:isMat?'#888':'#22C55E'}}>{isMat?'Matured':left+'d'}</span></div><div style={{display:'flex',justifyContent:'flex-end',marginTop:'4px'}}><button style={S.editBtn} onClick={e=>{e.stopPropagation();setEditingFdId(fd.id);setFdForm({bank:fd.bank,principal:String(fd.principal),rate:String(fd.rate),startDate:fd.startDate,maturityDate:fd.maturityDate,tenureMonths:'',compounding:fd.compounding||'4'});setAddingFd(true);}}>{'\u270F\uFE0F'}</button></div></div>;})}
            <button style={S.addBtn} onClick={()=>{setAddingFd(true);setEditingFdId(null);setFdForm({bank:'',principal:'',rate:'',startDate:'',maturityDate:'',tenureMonths:'',compounding:'4'});}}>+ Add FD</button>
          </div>}
        </div>}
      </div>}
 
      {tab==='tax'&&<div style={S.pg}>
        <div style={S.cardG}><div style={{fontSize:'10px',color:'#6A500A',textTransform:'uppercase',letterSpacing:'1.5px'}}>Regime: {taxProfile.regime==='new'?'New':'Old'} | Slab: {slabRate()}% | Income: {fmt(latestIncome)}</div></div>
        {(mfVal>0||stVal>0)&&(()=>{var ltcg=mfHoldings.filter(h=>h.type==='equity').reduce((s,h)=>s+Math.max(0,h.units*(h.currentNav||0)-h.units*(h.avgNav||0)),0)+stocks.reduce((s,h)=>s+Math.max(0,h.qty*(h.currentPrice||0)-h.qty*(h.avgPrice||0)),0),taxable=Math.max(0,ltcg-125000),tax=taxable*0.125;return<div style={S.card}><div style={S.ct}>Equity LTCG</div><Dr label="Gains" val={fmt(ltcg)}/><Dr label="Exempt" val={'\u20B91.25L'} color="#22C55E"/><Dr label="Taxable" val={fmt(taxable)} color={taxable>0?'#EF4444':'#22C55E'}/><Dr label="Tax @12.5%" val={fmt(tax)} color={tax>0?'#EF4444':'#22C55E'}/></div>;})()}
        {cryptoVal>0&&<div style={S.card}><div style={S.ct}>Crypto Tax</div><Dr label="Crypto Gains" val={fmt(Math.max(0,cryptoVal-cryptoCost))}/><Dr label="Tax @30% (flat)" val={fmt(Math.max(0,cryptoVal-cryptoCost)*0.3)} color="#EF4444"/><InfoBox>Crypto gains are taxed at flat 30% + 4% cess. No deductions allowed except cost of acquisition. 1% TDS on transfers above \u20B910K.</InfoBox></div>}
        <div style={S.card}><div style={S.ct}>Tax Tips</div>{[['Harvest \u20B91.25L LTCG yearly','Sell & repurchase equity before March 31. Zero tax up to \u20B91.25L.'],['SGB: hold 8 years','Zero capital gains for original subscribers at maturity.'],['EPF 5-year rule','10% TDS if withdrawn before 5 years. Tax-free after.'],['NPS: extra \u20B950K','80CCD(1B) gives \u20B950K extra deduction in old regime.'],['PPF: EEE benefit','Contribution, interest, and maturity all tax-free.'],['File ITR on time','Capital losses expire if ITR not filed by July 31.']].map(p=><div key={p[0]} style={{marginBottom:'8px',paddingBottom:'8px',borderBottom:'1px solid #141414'}}><div style={{fontSize:'12px',fontWeight:700,color:'#F2C94C',marginBottom:'2px'}}>{p[0]}</div><div style={{fontSize:'11px',color:'#444',lineHeight:1.5}}>{p[1]}</div></div>)}</div>
      </div>}
 
      <div style={S.nav}>{TABS.map(t=><div key={t.k} style={S.ni(tab===t.k)} onClick={()=>{setTab(t.k);setSubTab('portfolio');}}><span style={{fontSize:'18px'}}>{t.i}</span><span style={S.nl(tab===t.k)}>{t.l}</span></div>)}</div>
    </div>
  );
}
 
ReactDOM.createRoot(document.getElementById('root')).render(<WealthApp/>);
</script>
</body>
</html>
