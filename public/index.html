<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="theme-color" content="#080808"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>

<link rel="manifest" href="/manifest.json"/>

<link rel="apple-touch-icon" href="/icon.svg"/>
<title>Wealth Dashboard</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#080808;font-family:system-ui,sans-serif;-webkit-tap-highlight-color:transparent}input,button,textarea,select{font-family:inherit}::-webkit-scrollbar{display:none}.item-row{display:flex;justify-content:space-between;align-items:center;padding:8px;background:#141414;border-radius:8px;margin-bottom:4px}.item-acts{display:flex;gap:12px;font-size:10px}.item-acts span{cursor:pointer}</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef}=React;

const fmt=(n)=>{if(!n&&n!==0)return'\u2014';const num=parseFloat(n);if(isNaN(num))return'\u2014';if(num>=10000000)return'\u20B9'+(num/10000000).toFixed(2)+'Cr';if(num>=100000)return'\u20B9'+(num/100000).toFixed(2)+'L';if(num>=1000)return'\u20B9'+(num/1000).toFixed(1)+'K';return'\u20B9'+num.toFixed(0);};
const f=(n)=>parseFloat(n)||0;
const pct=(c,b)=>b>0?(((c-b)/b)*100).toFixed(1):'0.0';
const gc=(c,b)=>c>=b?'#22C55E':'#EF4444';
const daysBetween=(a,b)=>Math.floor((new Date(b)-new Date(a))/86400000);
const daysLeft=(d)=>daysBetween(new Date().toISOString().split('T')[0],d);
const daysHeld=(d)=>daysBetween(d,new Date().toISOString().split('T')[0]);
const fmtDate=(d)=>d?new Date(d).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}):'\u2014';
const calcFD=(p,r,days,freq=4)=>f(p)*Math.pow(1+f(r)/100/freq,freq*days/365);
const todayStr=()=>new Date().toISOString().split('T')[0];
const ld=(k,fb)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):fb;}catch{return fb;}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch{}};
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const addYears=(d,y)=>{const dt=new Date(d);dt.setFullYear(dt.getFullYear()+y);return dt.toISOString().split('T')[0];};

const _ds={display:'flex',justifyContent:'space-between',alignItems:'center',padding:'6px 0',borderBottom:'1px solid #141414'};
const _ls={fontSize:'10px',fontWeight:600,color:'#3A3A3A',textTransform:'uppercase',letterSpacing:'1px',marginBottom:'4px'};
const _is={width:'100%',background:'#141414',border:'1px solid #222',borderRadius:'8px',padding:'9px 11px',fontSize:'14px',color:'#F2C94C',outline:'none',boxSizing:'border-box',fontFamily:'inherit'};
const _ss={..._is,fontSize:'12px'};

function Dr({label,val,color,bold}){return<div style={_ds}><span style={{fontSize:'12px',color:'#555'}}>{label}</span><span style={{fontSize:'12px',fontWeight:bold?800:600,color:color||'#F2C94C'}}>{val}</span></div>;}
function Inp({label,value,onChange,type='number',placeholder='0'}){return<div style={{marginBottom:'8px'}}><div style={_ls}>{label}</div><input style={_is} type={type} placeholder={placeholder} value={value} onChange={onChange}/></div>;}
function Sel({label,value,onChange,options}){return<div style={{marginBottom:'8px'}}><div style={_ls}>{label}</div><select style={_ss} value={value} onChange={onChange}><option value="">Select</option>{options.map(o=><option key={o} value={o}>{o}</option>)}</select></div>;}
function Rule({icon,title,desc}){return<div style={{padding:'8px',background:'#141414',borderRadius:'8px',marginBottom:'4px'}}><div style={{fontSize:'11px',fontWeight:700,color:'#F2C94C',marginBottom:'2px'}}>{icon} {title}</div><div style={{fontSize:'11px',color:'#555',lineHeight:1.5}}>{desc}</div></div>;}

function PinScreen({onUnlock}){
  const sp=ld('w_pin',null);const[mode]=useState(sp?'enter':'setup');const[pin,setPin]=useState('');const[cp,setCp]=useState('');const[err,setErr]=useState('');const[step,setStep]=useState(1);
  const hk=(d)=>{setErr('');if(mode==='enter'){const n=pin+d;setPin(n);if(n.length===4){if(n===sp)onUnlock();else{setErr('Wrong PIN');setPin('');}}}else{if(step===1){const n=pin+d;setPin(n);if(n.length===4){setStep(2);setCp('');}}else{const n=cp+d;setCp(n);if(n.length===4){if(n===pin){sv('w_pin',pin);onUnlock();}else{setErr("PINs don't match");setPin('');setCp('');setStep(1);}}}}};
  const hd=()=>{setErr('');if(mode==='enter')setPin(pin.slice(0,-1));else if(step===1)setPin(pin.slice(0,-1));else setCp(cp.slice(0,-1));};
  const cur=mode==='enter'?pin:(step===1?pin:cp);const title=mode==='enter'?'Enter PIN':(step===1?'Set a 4-digit PIN':'Confirm PIN');
  return(<div style={{background:'#080808',minHeight:'100vh',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',maxWidth:'400px',margin:'0 auto',padding:'20px'}}>
    <div style={{fontSize:'40px',marginBottom:'16px'}}>{'\uD83D\uDC8E'}</div><div style={{fontSize:'18px',fontWeight:800,color:'#F2C94C',marginBottom:'6px'}}>Wealth Dashboard</div><div style={{fontSize:'13px',color:'#6A500A',marginBottom:'28px'}}>{title}</div>
    <div style={{display:'flex',gap:'14px',marginBottom:'8px'}}>{[0,1,2,3].map(i=><div key={i} style={{width:'16px',height:'16px',borderRadius:'50%',border:'2px solid #6A500A',background:i<cur.length?'#F2C94C':'transparent'}}/>)}</div>
    {err?<div style={{fontSize:'12px',color:'#EF4444',height:'26px',lineHeight:'26px'}}>{err}</div>:<div style={{height:'26px'}}/>}
    <div style={{display:'grid',gridTemplateColumns:'repeat(3,72px)',gap:'10px',marginTop:'8px'}}>{[1,2,3,4,5,6,7,8,9,'',0,'\u232B'].map(k=>{if(k==='')return<div key="e"/>;return<button key={k} onClick={()=>k==='\u232B'?hd():hk(String(k))} style={{width:'72px',height:'56px',borderRadius:'12px',border:'none',fontSize:k==='\u232B'?'20px':'22px',fontWeight:700,cursor:'pointer',background:k==='\u232B'?'transparent':'#141414',color:k==='\u232B'?'#6A500A':'#F2C94C'}}>{k}</button>;})}</div>
    {mode==='enter'&&<button onClick={()=>{if(confirm('Erase PIN and ALL data?')){localStorage.clear();location.reload();}}} style={{marginTop:'32px',background:'none',border:'none',color:'#2A2A2A',fontSize:'10px',cursor:'pointer'}}>Forgot PIN? Reset everything</button>}
  </div>);
}

function NWChart({history}){
  if(!history||history.length<2)return null;
  var data=history.slice(-30),vals=data.map(d=>d.nw),minV=Math.min(...vals),maxV=Math.max(...vals),range=maxV-minV||1,W=340,H=120,pY=10;
  var pts=data.map((d,i)=>{var x=(i/(data.length-1))*W;var y=H-pY-((d.nw-minV)/range)*(H-pY*2);return x+','+y;}).join(' ');
  var first=data[0],last=data[data.length-1],ch=last.nw-first.nw,chP=first.nw>0?((ch/first.nw)*100).toFixed(1):'0',up=ch>=0;
  return(<div style={{background:'#0F0F0F',border:'1px solid #1C1C1C',borderRadius:'14px',padding:'14px',marginBottom:'10px'}}>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'10px'}}><div style={{fontSize:'10px',fontWeight:800,color:'#F2C94C',letterSpacing:'2px',textTransform:'uppercase'}}>Net Worth Trend</div><div style={{fontSize:'11px',fontWeight:700,color:up?'#22C55E':'#EF4444'}}>{up?'+':''}{fmt(ch)} ({chP}%)</div></div>
    <svg viewBox={'0 0 '+W+' '+H} style={{width:'100%',height:'120px'}}><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={up?'#22C55E':'#EF4444'} stopOpacity="0.3"/><stop offset="100%" stopColor={up?'#22C55E':'#EF4444'} stopOpacity="0"/></linearGradient></defs><polygon points={'0,'+(H-pY)+' '+pts+' '+W+','+(H-pY)} fill="url(#g)"/><polyline points={pts} fill="none" stroke={up?'#22C55E':'#EF4444'} strokeWidth="2" strokeLinejoin="round"/></svg>
    <div style={{display:'flex',justifyContent:'space-between',marginTop:'4px'}}><span style={{fontSize:'9px',color:'#3A3A3A'}}>{first.date}</span><span style={{fontSize:'9px',color:'#3A3A3A'}}>{last.date}</span></div>
  </div>);
}

function WealthApp(){
  const[locked,setLocked]=useState(()=>!!ld('w_pin',null));
  const[tab,setTab]=useState('home');
  const[subTab,setSubTab]=useState('portfolio');
  const[refreshing,setRefreshing]=useState(false);
  const[showSettings,setShowSettings]=useState(false);
  const[editId,setEditId]=useState(null);

  // Prices
  const[prices,setPrices]=useState(()=>ld('w_prices',{gold24k:9500,gold22k:8700,gold18k:7125,silver:105,updated:null}));
  const[editingPrices,setEditingPrices]=useState(false);
  const[tempPrices,setTempPrices]=useState({});

  // Metal items [{id,category,desc,weight,value,purchasePrice}]
  const[metalItems,setMetalItems]=useState(()=>ld('w_mi',[]));
  const[addingMetalCat,setAddingMetalCat]=useState(null);
  const[newMI,setNewMI]=useState({desc:'',weight:'',value:'',purchasePrice:''});

  // SGB
  const[sgb,setSgb]=useState(()=>ld('w_sgb',{grams:'',purchasePrice:'',purchaseType:'primary',purchaseDate:''}));

  // Govt schemes
  const[ppf,setPpf]=useState(()=>ld('w_ppf',{balance:'',startDate:'',monthlyContrib:'',interestRate:'7.1'}));
  const[nps,setNps]=useState(()=>ld('w_nps',{balance:'',monthlyContrib:'',age:'',retireAge:'60'}));
  const[epf,setEpf]=useState(()=>ld('w_epf',{balance:'',monthlyContrib:'',employerContrib:'',serviceYears:'',interestRate:'8.25'}));

  // Markets
  const[mfHoldings,setMfHoldings]=useState(()=>ld('w_mf',[]));
  const[sips,setSips]=useState(()=>ld('w_sips',[]));
  const[stocks,setStocks]=useState(()=>ld('w_stocks',[]));
  const[crypto,setCrypto]=useState(()=>ld('w_crypto',[]));
  const[fds,setFds]=useState(()=>ld('w_fds',[]));

  // Form states
  const[addingMf,setAddingMf]=useState(false);
  const[mfSearch,setMfSearch]=useState('');
  const[mfResults,setMfResults]=useState([]);
  const[searching,setSearching]=useState(false);
  const[newMf,setNewMf]=useState({schemeCode:'',schemeName:'',units:'',avgNav:'',type:'equity'});
  const[linkingMfId,setLinkingMfId]=useState(null);
  const[linkSearch,setLinkSearch]=useState('');
  const[linkResults,setLinkResults]=useState([]);

  const[addingSip,setAddingSip]=useState(false);
  const[newSip,setNewSip]=useState({name:'',amount:'',debitDate:'',startDate:'',frequency:'monthly',units:'',status:'active'});

  const[addingStock,setAddingStock]=useState(false);
  const[loadingStocks,setLoadingStocks]=useState(false);
  const[newStock,setNewStock]=useState({symbol:'',name:'',qty:'',avgPrice:''});
  const[stockSearch,setStockSearch]=useState('');
  const[stockResults,setStockResults]=useState([]);

  const[addingCrypto,setAddingCrypto]=useState(false);
  const[newCrypto,setNewCrypto]=useState({coin:'bitcoin',symbol:'BTC',qty:'',buyPrice:''});

  const[selectedFd,setSelectedFd]=useState(null);
  const[addingFd,setAddingFd]=useState(false);
  const[fdForm,setFdForm]=useState({bank:'',principal:'',rate:'',startDate:'',maturityDate:'',tenureMonths:'',compounding:'4'});
  const[wdDate,setWdDate]=useState('');
  const[penalty,setPenalty]=useState('1');

  // Tax
  const[taxProfile,setTaxProfile]=useState(()=>ld('w_tax',{regime:'new',entries:[]}));
  const[addingIncome,setAddingIncome]=useState(false);
  const[newIncome,setNewIncome]=useState({month:'',year:'',income:''});

  // Debt
  const[debts,setDebts]=useState(()=>ld('w_debts',[]));
  const[addingDebt,setAddingDebt]=useState(false);
  const[newDebt,setNewDebt]=useState({type:'home_loan',name:'',originalAmt:'',outstanding:'',rate:'',emi:'',tenureLeft:'',startDate:'',notes:''});

  // Import
  const[importPreview,setImportPreview]=useState(null);
  const stockFileRef=useRef(null);
  const mfFileRef=useRef(null);

  const[nwHistory,setNwHistory]=useState(()=>ld('w_nwhistory',[]));
  const didAutoRefresh=useRef(false);

  const uPrices=(p)=>{setPrices(p);sv('w_prices',p);};
  const uMI=(v)=>{setMetalItems(v);sv('w_mi',v);};
  const uSgb=(v)=>{setSgb(v);sv('w_sgb',v);};
  const uPpf=(v)=>{setPpf(v);sv('w_ppf',v);};
  const uNps=(v)=>{setNps(v);sv('w_nps',v);};
  const uEpf=(v)=>{setEpf(v);sv('w_epf',v);};
  const uMf=(v)=>{setMfHoldings(v);sv('w_mf',v);};
  const uSips=(v)=>{setSips(v);sv('w_sips',v);};
  const uStocks=(v)=>{setStocks(v);sv('w_stocks',v);};
  const uCrypto=(v)=>{setCrypto(v);sv('w_crypto',v);};
  const uFds=(v)=>{setFds(v);sv('w_fds',v);};
  const uTax=(v)=>{setTaxProfile(v);sv('w_tax',v);};
  const uDebts=(v)=>{setDebts(v);sv('w_debts',v);};

  const fetchNAV=async(code)=>{try{const r=await fetch('https://api.mfapi.in/mf/'+code+'/latest');const d=await r.json();if(d&&d.data&&d.data[0])return{nav:parseFloat(d.data[0].nav),date:d.data[0].date};}catch{}return null;};
  const searchMFn=async(q)=>{if(!q||q.length<2){setMfResults([]);return;}setSearching(true);try{const r=await fetch('https://api.mfapi.in/mf/search?q='+encodeURIComponent(q));const d=await r.json();setMfResults((Array.isArray(d)?d:[]).slice(0,7));}catch{setMfResults([]);}setSearching(false);};
  const fetchSP=async(list)=>{if(!list.length)return list;try{const sym=list.map(s=>s.symbol).join(',');const r=await fetch('/api/stocks?symbols='+encodeURIComponent(sym));const arr=await r.json();if(Array.isArray(arr)){const m={};arr.forEach(p=>{if(p.symbol)m[p.symbol.toUpperCase()]=p;});return list.map(s=>{const fd=m[s.symbol.toUpperCase()];return fd&&fd.price?{...s,currentPrice:fd.price,change:fd.change}:s;});}}catch{}return list;};
  const searchStocks=async(q)=>{if(!q||q.length<2){setStockResults([]);return;}try{const r=await fetch('/api/stocks?search='+encodeURIComponent(q));const d=await r.json();setStockResults(Array.isArray(d)?d.slice(0,6):[]);}catch{setStockResults([]);}};
  const fetchCryptoPrices=async(list)=>{if(!list.length)return list;try{const ids=list.map(c=>c.coin).join(',');const r=await fetch('https://api.coingecko.com/api/v3/simple/price?ids='+encodeURIComponent(ids)+'&vs_currencies=inr&include_24hr_change=true');const d=await r.json();return list.map(c=>{const p=d[c.coin];return p?{...c,priceINR:p.inr,change24h:p.inr_24h_change}:c;});}catch{}return list;};

  // Import helpers
  const parseFile=(file,cb)=>{const reader=new FileReader();reader.onload=(e)=>{try{const wb=XLSX.read(e.target.result,{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];cb(XLSX.utils.sheet_to_json(ws,{defval:''}));}catch(err){alert('Could not read: '+err.message);}};reader.readAsArrayBuffer(file);};
  const findCol=(row,cs)=>{const keys=Object.keys(row);for(const c of cs){const found=keys.find(k=>k.toLowerCase().replace(/[^a-z0-9]/g,'').includes(c.toLowerCase().replace(/[^a-z0-9]/g,'')));if(found)return found;}return null;};
  const importStocks=(file)=>{parseFile(file,(rows)=>{if(!rows.length){alert('No data');return;}const sc=findCol(rows[0],['instrument','symbol','stock','trading symbol','scrip']);const qc=findCol(rows[0],['qty','quantity','shares']);const ac=findCol(rows[0],['avg cost','avg price','average cost','buy avg','cost price']);if(!sc||!qc){alert('Could not find columns. Found: '+Object.keys(rows[0]).join(', '));return;}const parsed=rows.filter(r=>r[sc]&&f(r[qc])>0).map(r=>({id:Date.now()+Math.random(),symbol:String(r[sc]).replace(/-.*$/,'').replace(/\s+/g,'').toUpperCase(),name:String(r[sc]).replace(/-.*$/,'').trim(),qty:f(r[qc]),avgPrice:ac?f(r[ac]):0,currentPrice:null,change:null}));if(!parsed.length){alert('No valid rows');return;}setImportPreview({type:'stocks',data:parsed});});};
  const importMF=(file)=>{parseFile(file,(rows)=>{if(!rows.length){alert('No data');return;}const nc=findCol(rows[0],['scheme','fund name','fund','scheme name']);const uc=findCol(rows[0],['units','unit','quantity']);const ac=findCol(rows[0],['avg nav','avg cost','average nav','cost price']);if(!nc||!uc){alert('Could not find columns. Found: '+Object.keys(rows[0]).join(', '));return;}const parsed=rows.filter(r=>r[nc]&&f(r[uc])>0).map(r=>({id:Date.now()+Math.random(),schemeCode:'',schemeName:String(r[nc]).trim(),units:f(r[uc]),avgNav:ac?f(r[ac]):0,type:'equity',currentNav:null,navDate:null}));if(!parsed.length){alert('No valid rows');return;}setImportPreview({type:'funds',data:parsed});});};
  const confirmImport=async()=>{if(!importPreview)return;if(importPreview.type==='stocks'){const merged=[...stocks,...importPreview.data];const updated=await fetchSP(merged);uStocks(updated);}else{uMf([...mfHoldings,...importPreview.data]);}setImportPreview(null);};

  // Computed
  const catRate=(cat)=>cat==='gold24k'?prices.gold24k:cat==='gold22k'?prices.gold22k:cat==='gold18k'?prices.gold18k:cat==='goldJewellery'?prices.gold22k:cat==='silver'||cat==='silverArticles'?prices.silver:0;
  const catTotal=(cat)=>metalItems.filter(i=>i.category===cat).reduce((s,i)=>cat==='diamond'?s+f(i.value):s+f(i.weight)*(catRate(cat)||0),0);
  const catWeight=(cat)=>metalItems.filter(i=>i.category===cat).reduce((s,i)=>s+f(i.weight),0);
  const catCost=(cat)=>metalItems.filter(i=>i.category===cat).reduce((s,i)=>s+f(i.purchasePrice),0);
  const metalVal=()=>metalItems.reduce((s,i)=>i.category==='diamond'?s+f(i.value):s+f(i.weight)*(catRate(i.category)||0),0);
  const sgbVal=()=>f(sgb.grams)*(prices.gold24k||0);
  const sgbInterestEarned=()=>{if(!sgb.purchaseDate||!sgb.grams||!sgb.purchasePrice)return 0;const yrs=(new Date()-new Date(sgb.purchaseDate))/(365.25*864e5);return f(sgb.grams)*f(sgb.purchasePrice)*0.025*yrs;};
  const cryptoVal=crypto.reduce((s,c)=>s+f(c.qty)*(c.priceINR||0),0);
  const cryptoCost=crypto.reduce((s,c)=>s+f(c.qty)*f(c.buyPrice),0);
  const mfVal=mfHoldings.reduce((s,h)=>s+h.units*(h.currentNav||0),0);
  const mfCost=mfHoldings.reduce((s,h)=>s+h.units*(h.avgNav||0),0);
  const stVal=stocks.reduce((s,h)=>s+h.qty*(h.currentPrice||0),0);
  const stCost=stocks.reduce((s,h)=>s+h.qty*(h.avgPrice||0),0);
  const fdVal=fds.reduce((s,fd)=>{var held=Math.max(0,daysHeld(fd.startDate));return s+calcFD(fd.principal,fd.rate,held,fd.compounding);},0);
  const fdMatVal=fds.reduce((s,fd)=>s+calcFD(fd.principal,fd.rate,daysBetween(fd.startDate,fd.maturityDate),fd.compounding),0);
  const govtVal=f(ppf.balance)+f(nps.balance)+f(epf.balance);
  const totalAssets=metalVal()+sgbVal()+govtVal+mfVal+stVal+cryptoVal+fdVal;
  const totalDebt=debts.reduce((s,d)=>s+f(d.outstanding),0);
  const totalNW=()=>totalAssets-totalDebt;
  const latestIncome=taxProfile.entries&&taxProfile.entries.length>0?f(taxProfile.entries[taxProfile.entries.length-1].income):0;
  const slabRate=()=>{const i=latestIncome;if(taxProfile.regime==='new'){if(i<=400000)return 0;if(i<=800000)return 5;if(i<=1200000)return 10;if(i<=1600000)return 15;if(i<=2000000)return 20;if(i<=2400000)return 25;return 30;}if(i<=250000)return 0;if(i<=500000)return 5;if(i<=1000000)return 20;return 30;};

  const saveSnapshot=(nw)=>{var t=todayStr();var h=ld('w_nwhistory',[]);var l=h.length>0?h[h.length-1]:null;if(l&&l.dk===t)h[h.length-1]={dk:t,date:new Date().toLocaleDateString('en-IN',{day:'numeric',month:'short'}),nw};else h.push({dk:t,date:new Date().toLocaleDateString('en-IN',{day:'numeric',month:'short'}),nw});if(h.length>90)h=h.slice(-90);sv('w_nwhistory',h);setNwHistory(h);};

  const refreshAll=async()=>{setRefreshing(true);var um=mfHoldings,us=stocks,uc=crypto;if(mfHoldings.length){um=await Promise.all(mfHoldings.map(async h=>{if(!h.schemeCode)return h;var n=await fetchNAV(h.schemeCode);return n?{...h,currentNav:n.nav,navDate:n.date}:h;}));uMf(um);}if(stocks.length){us=await fetchSP(stocks);uStocks(us);}if(crypto.length){uc=await fetchCryptoPrices(crypto);uCrypto(uc);}setRefreshing(false);return{mf:um,st:us,cr:uc};};

  useEffect(()=>{if(!locked&&!didAutoRefresh.current){didAutoRefresh.current=true;refreshAll().then(r=>{var mv=(r.mf||[]).reduce((s,h)=>s+h.units*(h.currentNav||0),0);var sv2=(r.st||[]).reduce((s,h)=>s+h.qty*(h.currentPrice||0),0);var cv=(r.cr||[]).reduce((s,c)=>s+f(c.qty)*(c.priceINR||0),0);var nw=metalVal()+sgbVal()+govtVal+mv+sv2+cv+fdVal-totalDebt;if(nw>0)saveSnapshot(nw);});}},[locked]);

  const exportCSV=()=>{var rows=[['Category','Item','Qty','Cost','Value']];metalItems.forEach(i=>rows.push(['Metal',i.category+(i.desc?' - '+i.desc:''),i.category==='diamond'?'':i.weight+'g',i.purchasePrice||'',i.category==='diamond'?String(f(i.value)):String(f(i.weight)*(catRate(i.category)||0))]));if(sgb.grams)rows.push(['SGB','Gold Bond',sgb.grams+'g',String(f(sgb.purchasePrice)*f(sgb.grams)),String(sgbVal())]);rows.push(['PPF','','','',ppf.balance||'0']);rows.push(['NPS','','','',nps.balance||'0']);rows.push(['EPF','','','',epf.balance||'0']);crypto.forEach(c=>rows.push(['Crypto',c.symbol,String(c.qty),String(f(c.qty)*f(c.buyPrice)),String(f(c.qty)*(c.priceINR||0))]));mfHoldings.forEach(h=>rows.push(['MF',h.schemeName,String(h.units),String(h.units*h.avgNav),String(h.units*(h.currentNav||0))]));sips.forEach(s=>rows.push(['SIP',s.name,s.units||'','\u20B9'+s.amount+'/'+s.frequency,s.status]));stocks.forEach(h=>rows.push(['Stock',h.symbol,String(h.qty),String(h.qty*h.avgPrice),String(h.qty*(h.currentPrice||0))]));fds.forEach(fd=>rows.push(['FD',fd.bank,fd.rate+'%',String(fd.principal),String(calcFD(fd.principal,fd.rate,daysBetween(fd.startDate,fd.maturityDate),fd.compounding))]));debts.forEach(d=>rows.push(['Debt',d.name,'','',' -'+d.outstanding]));rows.push([]);rows.push(['Total Assets','','','',String(totalAssets)]);rows.push(['Total Debt','','','',String(totalDebt)]);rows.push(['NET WORTH','','','',String(totalNW())]);var csv=rows.map(r=>r.map(c=>'"'+String(c||'').replace(/"/g,'""')+'"').join(',')).join('\n');var blob=new Blob([csv],{type:'text/csv'});var u=URL.createObjectURL(blob);var a=document.createElement('a');a.href=u;a.download='wealth_'+todayStr()+'.csv';a.click();URL.revokeObjectURL(u);};

  // Edit helper

          {!isDiamond&&weight>0&&<div style={{fontSize:'10px',color:'#6A500A',marginBottom:'8px'}}>Total: {weight.toFixed(1)}g {cost>0?' \u00B7 Paid: '+fmt(cost)+' \u00B7 Gain: '+fmt(total-cost):''}</div>}

          :<div key={item.id} className="item-row"><div><div style={{fontSize:'12px',color:'#F2C94C',fontWeight:600}}>{item.desc||cat}</div><div style={{fontSize:'10px',color:'#3A3A3A'}}>{isDiamond?'\u20B9'+f(item.value).toLocaleString('en-IN'):item.weight+'g \u00B7 '+fmt(f(item.weight)*(catRate(cat)||0))}{item.purchasePrice?' \u00B7 Paid: '+fmt(f(item.purchasePrice)):''}{item.purchasePrice&&!isDiamond?' \u00B7 '+(f(item.weight)*(catRate(cat)||0)>=f(item.purchasePrice)?'+':'')+fmt(f(item.weight)*(catRate(cat)||0)-f(item.purchasePrice)):''}</div></div><Acts onEdit={()=>startEdit('metal',item.id,{...item})} onRemove={()=>uMI(metalItems.filter(x=>x.id!==item.id))}/></div>)}
          {addingMetalCat===cat?<div style={{padding:'8px',background:'#0D0B00',borderRadius:'8px',border:'1px solid #6A500A33',marginTop:'4px'}}><Inp label="Description" value={newMI.desc} onChange={e=>setNewMI(p=>({...p,desc:e.target.value}))} type="text" placeholder={isDiamond?'Ring, Pendant...':'Coin, Chain, Bangle...'}/>{isDiamond?<Inp label="Estimated Value (\u20B9)" value={newMI.value} onChange={e=>setNewMI(p=>({...p,value:e.target.value}))}/>:<div><Inp label="Weight (grams)" value={newMI.weight} onChange={e=>setNewMI(p=>({...p,weight:e.target.value}))}/><Inp label="Purchase Cost (\u20B9, optional)" value={newMI.purchasePrice} onChange={e=>setNewMI(p=>({...p,purchasePrice:e.target.value}))} placeholder="Optional"/></div>}<div style={S.row2}><button style={{...S.addBtn,flex:1,marginTop:0}} onClick={()=>{if(isDiamond?!newMI.value:!newMI.weight)return;uMI([...metalItems,{id:Date.now(),category:cat,desc:newMI.desc,weight:isDiamond?'':f(newMI.weight),value:isDiamond?f(newMI.value):'',purchasePrice:f(newMI.purchasePrice)||''}]);setNewMI({desc:'',weight:'',value:'',purchasePrice:''});setAddingMetalCat(null);}}>Add</button><button style={{...S.addBtn,flex:1,marginTop:0,background:'#1A1A1A',color:'#888'}} onClick={()=>setAddingMetalCat(null)}>Cancel</button></div></div>
          :<button style={S.secBtn} onClick={()=>{setAddingMetalCat(cat);setNewMI({desc:'',weight:'',value:'',purchasePrice:''});}}>+ Add {label.split('(')[0].trim()}</button>}
        </div>;
      })}

      {metalVal()>0&&<div style={{...S.cardG,textAlign:'center'}}><div style={{fontSize:'9px',color:'#6A500A',letterSpacing:'1px',marginBottom:'2px'}}>TOTAL METALS & JEWELLERY</div><div style={{fontSize:'22px',fontWeight:800,color:'#F2C94C'}}>{fmt(metalVal())}</div></div>}

      {/* SGB */}
      <div style={S.card}><div style={S.ct}>Sovereign Gold Bonds</div>

        <Inp label="Units (grams)" value={sgb.grams} onChange={e=>uSgb({...sgb,grams:e.target.value})}/>

        {sgb.grams&&sgb.purchaseDate&&sgb.purchasePrice&&(()=>{
          var yrs=(new Date()-new Date(sgb.purchaseDate))/(365.25*864e5);var matDate=addYears(sgb.purchaseDate,8);var lockEnd=addYears(sgb.purchaseDate,5);var locked5=yrs<5;var intEarned=sgbInterestEarned();var gain=sgbVal()-f(sgb.purchasePrice)*f(sgb.grams);

            <div style={{padding:'10px',background:'#141414',borderRadius:'10px',marginBottom:'6px'}}>

              <Dr label="Held" val={yrs.toFixed(1)+' years'} color="#888"/>

            <Rule icon={locked5?'\uD83D\uDD12':'\u2705'} title={locked5?'Lock-in: '+Math.ceil((5-yrs)*12)+' months left':'Early exit available'} desc={locked5?'No exit before 5 years from issue date ('+fmtDate(lockEnd)+')':'Redeemable on interest payment dates (semi-annual). Next window check with RBI.'}/>
            {sgb.purchaseType==='primary'?<Rule icon={yrs>=8?'\u2705':'\u23F3'} title={yrs>=8?'ZERO capital gains tax':'Hold '+(8-yrs).toFixed(1)+' more years for zero tax'} desc={yrs>=8?'Original subscriber held to maturity \u2014 no tax on capital gains.':'At maturity (8 yrs), capital gains are completely tax-free for original subscribers. Early exit: LTCG @ 12.5%.'}/>

            <Rule icon="\uD83D\uDCB0" title="Interest: 2.5% PA taxed at slab rate" desc={'Semi-annual interest on issue price (\u20B9'+f(sgb.purchasePrice).toLocaleString('en-IN')+'/g). Approx \u20B9'+(f(sgb.grams)*f(sgb.purchasePrice)*0.025/2).toFixed(0)+' every 6 months. Taxable at your slab rate ('+slabRate()+'%).'}/>
          </div>;
        })()}
      </div>
    </div>}

    {tab==='govt'&&<div style={S.pg}>
      {/* PPF */}
      <div style={S.card}><div style={S.ct}>{'\uD83D\uDCB0'} Public Provident Fund (PPF)</div>
        <Inp label="Current Balance (\u20B9)" value={ppf.balance} onChange={e=>uPpf({...ppf,balance:e.target.value})}/>
        <div style={_ls}>Start Date</div><input style={{..._is,marginBottom:'8px'}} type="date" value={ppf.startDate||''} onChange={e=>uPpf({...ppf,startDate:e.target.value})}/>
        <Inp label="Monthly Contribution (\u20B9)" value={ppf.monthlyContrib} onChange={e=>uPpf({...ppf,monthlyContrib:e.target.value})} placeholder="12500"/>
        <Inp label="Interest Rate (%)" value={ppf.interestRate} onChange={e=>uPpf({...ppf,interestRate:e.target.value})} placeholder="7.1"/>
        {ppf.balance&&ppf.startDate&&(()=>{
          var yrs=Math.max(0,(new Date()-new Date(ppf.startDate))/(365.25*864e5));var matDate=addYears(ppf.startDate,15);var left=Math.max(0,15-yrs);
          var projBal=f(ppf.balance);if(ppf.monthlyContrib){for(var i=0;i<Math.ceil(left);i++)projBal=(projBal+f(ppf.monthlyContrib)*12)*((100+f(ppf.interestRate))/100);}
          return<div style={{marginTop:'4px'}}>
            <div style={{padding:'10px',background:'#141414',borderRadius:'10px',marginBottom:'6px'}}>
              <Dr label="Account Age" val={yrs.toFixed(1)+' years'} color="#888"/>
              <Dr label="Maturity Date" val={fmtDate(matDate)}/>
              <Dr label="Years Remaining" val={left.toFixed(1)+' years'} color={left<=0?'#22C55E':'#888'}/>
              {ppf.monthlyContrib&&<Dr label="Projected at Maturity" val={fmt(projBal)} color="#22C55E"/>}
            </div>
            <Rule icon={yrs>=15?'\u2705':'\u23F3'} title={yrs>=15?'Matured! Extend or withdraw':'Matures in '+left.toFixed(0)+' years'} desc={yrs>=15?'Full withdrawal tax-free (EEE). Can extend in 5-year blocks with/without fresh contributions.':'15-year lock-in. Maturity amount is 100% tax-free.'}/>
            <Rule icon={yrs>=7?'\u2705':'\uD83D\uDD12'} title={yrs>=7?'Partial withdrawal available':'Partial withdrawal from Year 7'} desc={yrs>=7?'Can withdraw up to 50% of balance at end of 4th preceding year. One withdrawal per year.':'Available from 7th financial year. Up to 50% of balance at end of Year 4.'}/>
            <Rule icon="\uD83D\uDCB0" title="Interest: '+ppf.interestRate+'% PA compounded annually" desc="Interest calculated on minimum balance between 5th and last day of month. Deposit before 5th for maximum interest."/>
            <Rule icon="\u2728" title="EEE Tax Status" desc="Exempt at deposit (80C up to \u20B91.5L), exempt on interest, exempt at maturity. Max \u20B91.5L/year deposit."/>
          </div>;
        })()}

        <Inp label="Current Balance (\u20B9)" value={nps.balance} onChange={e=>uNps({...nps,balance:e.target.value})}/>
        <Inp label="Monthly Contribution (\u20B9)" value={nps.monthlyContrib} onChange={e=>uNps({...nps,monthlyContrib:e.target.value})}/>
        <div style={S.row2}><div style={{flex:1}}><Inp label="Your Age" value={nps.age} onChange={e=>uNps({...nps,age:e.target.value})} placeholder="35"/></div><div style={{flex:1}}><Inp label="Retire at Age" value={nps.retireAge} onChange={e=>uNps({...nps,retireAge:e.target.value})} placeholder="60"/></div></div>
        {nps.balance&&nps.age&&(()=>{
          var yrsLeft=Math.max(0,f(nps.retireAge)-f(nps.age));var corpus=f(nps.balance);if(nps.monthlyContrib){for(var i=0;i<yrsLeft;i++)corpus=(corpus+f(nps.monthlyContrib)*12)*1.10;}
          var lumpSum=corpus*0.6;var annuity=corpus*0.4;
          return<div style={{marginTop:'4px'}}>
            <div style={{padding:'10px',background:'#141414',borderRadius:'10px',marginBottom:'6px'}}>
              <Dr label="Years to Retirement" val={yrsLeft.toFixed(0)+' years'} color="#888"/>
              {nps.monthlyContrib&&<Dr label="Projected Corpus at "+nps.retireAge val={fmt(corpus)} color="#22C55E"/>}
              {nps.monthlyContrib&&<Dr label="60% Lump Sum (tax-free)" val={fmt(lumpSum)} color="#22C55E"/>}
              {nps.monthlyContrib&&<Dr label="40% Annuity (pension)" val={fmt(annuity)} color="#888"/>}
            </div>
            <Rule icon="\u2705" title="At 60: 60% lump sum tax-free" desc="Withdraw up to 60% of corpus as lump sum \u2014 completely tax-free. Remaining 40% must buy an annuity for monthly pension."/>
            <Rule icon="\u26A0\uFE0F" title="Before 60: only 20% lump sum" desc="Premature exit: only 20% lump sum allowed. 80% must go to annuity. Allowed after 10 years of contribution."/>
            <Rule icon="\uD83D\uDCB0" title="Tax: Extra \u20B950K deduction (Old Regime)" desc="80CCD(1B) gives \u20B950K deduction over the \u20B91.5L 80C limit. Only available in old tax regime."/>
          </div>;
        })()}
      </div>

      {/* EPF */}
      <div style={S.card}><div style={S.ct}>{'\uD83D\uDC54'} Employee Provident Fund (EPF)</div>

        <div style={S.row2}><div style={{flex:1}}><Inp label="Your Monthly (\u20B9)" value={epf.monthlyContrib} onChange={e=>uEpf({...epf,monthlyContrib:e.target.value})}/></div><div style={{flex:1}}><Inp label="Employer Monthly (\u20B9)" value={epf.employerContrib} onChange={e=>uEpf({...epf,employerContrib:e.target.value})}/></div></div>

        {epf.balance&&epf.serviceYears&&(()=>{

            <Rule icon="\uD83D\uDCB0" title={'Interest: '+epf.interestRate+'% PA'} desc={'Current rate '+epf.interestRate+'%. Compounded annually. Interest above \u20B92.5L/year is taxable (for high earners).'}/>
            {monthly>0&&<Rule icon="\uD83D\uDCC8" title="Monthly inflow" desc={'\u20B9'+monthly.toLocaleString('en-IN')+'/month (You: \u20B9'+f(epf.monthlyContrib).toLocaleString('en-IN')+' + Employer: \u20B9'+f(epf.employerContrib).toLocaleString('en-IN')+')'}/>}
          </div>;

    </div>}

        <div style={{...S.cardG,textAlign:'center',padding:'18px 14px'}}><div style={{fontSize:'9px',color:'#6A500A',letterSpacing:'2px',textTransform:'uppercase',marginBottom:'4px'}}>Market Portfolio</div><div style={{fontSize:'30px',fontWeight:800,color:'#F2C94C'}}>{fmt(mfVal+stVal+cryptoVal+fdVal)||'\u20B90'}</div>
        <div style={{display:'flex',justifyContent:'center',gap:'12px',marginTop:'8px',flexWrap:'wrap'}}>
          {mfVal>0&&<div style={{textAlign:'center'}}><div style={{fontSize:'9px',color:'#3A3A3A'}}>MF</div><div style={{fontSize:'12px',fontWeight:700,color:'#F2C94C'}}>{fmt(mfVal)}</div></div>}

        {mfHoldings.map(h=>{var cur=h.units*(h.currentNav||0),cost=h.units*(h.avgNav||0);
          return isEditing('mf',h.id)?<div key={h.id} style={{padding:'10px',background:'#0D0B00',borderRadius:'10px',marginBottom:'8px'}}><Inp label="Units" value={editId.data.units||''} onChange={e=>ed('units',f(e.target.value))}/><Inp label="Avg NAV" value={editId.data.avgNav||''} onChange={e=>ed('avgNav',f(e.target.value))}/><div style={S.row2}><button style={{...S.addBtn,flex:1,marginTop:0}} onClick={()=>saveEdit('mf')}>Save</button><button style={{...S.addBtn,flex:1,marginTop:0,background:'#1A1A1A',color:'#888'}} onClick={()=>setEditId(null)}>Cancel</button></div></div>
          :<div key={h.id} style={S.holdCard}><div style={{display:'flex',justifyContent:'space-between',gap:'8px'}}><div style={{flex:1}}><div style={{fontSize:'12px',fontWeight:700,color:'#F2C94C',marginBottom:'4px'}}>{h.schemeName}</div><span style={{fontSize:'10px',color:'#3A3A3A'}}>{h.units} units</span>{h.currentNav&&<span style={{fontSize:'10px',color:'#6A500A',marginLeft:'6px'}}>NAV \u20B9{h.currentNav.toFixed(2)}</span>}</div><div style={{textAlign:'right'}}><div style={{fontSize:'14px',fontWeight:800,color:'#F2C94C'}}>{h.currentNav?fmt(cur):'\u2014'}</div>{cost>0&&h.currentNav&&<div style={{fontSize:'11px',color:gc(cur,cost)}}>{pct(cur,cost)}%</div>}</div></div>

          <div style={{display:'flex',justifyContent:'flex-end',marginTop:'4px'}}><Acts onEdit={()=>startEdit('mf',h.id,{units:h.units,avgNav:h.avgNav})} onRemove={()=>uMf(mfHoldings.filter(x=>x.id!==h.id))}/></div>

        </div>;})()
        :<div>
          {fds.length>0&&<div style={S.cardG}><div style={{display:'flex'}}>{[['Invested',fmt(fds.reduce((s,fd)=>s+fd.principal,0))],['Today',fmt(fdVal)],['Maturity',fmt(fdMatVal)]].map((p,i)=><div key={p[0]} style={{flex:1,textAlign:'center',borderRight:i<2?'1px solid #2A2A1A':'none'}}><div style={{fontSize:'9px',color:'#6A500A',textTransform:'uppercase'}}>{p[0]}</div><div style={{fontSize:'14px',fontWeight:800,color:'#F2C94C'}}>{p[1]}</div></div>)}</div></div>}
          {fds.map(fd=>{var td=daysBetween(fd.startDate,fd.maturityDate),left=daysLeft(fd.maturityDate),held=daysHeld(fd.startDate),mat=calcFD(fd.principal,fd.rate,td,fd.compounding),curVal=calcFD(fd.principal,fd.rate,Math.max(0,held),fd.compounding),prog=Math.min(100,Math.max(0,(held/td)*100)),isMat=left<=0;return<div key={fd.id} style={{background:'#141414',border:'1px solid #1C1C1C',borderRadius:'12px',padding:'13px',marginBottom:'8px',cursor:'pointer'}} onClick={()=>{setSelectedFd(fd);setWdDate('');setPenalty('1');}}><div style={{display:'flex',justifyContent:'space-between',marginBottom:'6px'}}><div><div style={{fontSize:'14px',fontWeight:800,color:'#F2C94C'}}>{fd.bank}</div><div style={{fontSize:'11px',color:'#3A3A3A'}}>{fd.rate}% {fmt(fd.principal)}</div></div><div style={{textAlign:'right'}}><div style={{fontSize:'14px',fontWeight:800,color:'#F2C94C'}}>{fmt(isMat?mat:curVal)}</div><div style={{fontSize:'9px',color:'#6A500A'}}>{isMat?'Matured':'Today'}</div>{!isMat&&<div style={{fontSize:'10px',color:'#22C55E'}}>Mat: {fmt(mat)}</div>}</div></div>{!isMat&&<div style={{height:'3px',background:'#1A1A1A',borderRadius:'2px'}}><div style={{height:'100%',width:prog+'%',background:'#22C55E',borderRadius:'2px',opacity:0.7}}/></div>}<div style={{display:'flex',justifyContent:'space-between',marginTop:'4px'}}><span style={{fontSize:'10px',color:'#3A3A3A'}}>{fmtDate(fd.maturityDate)}</span><span style={{fontSize:'10px',color:isMat?'#888':'#22C55E'}}>{isMat?'Matured':left+'d'}</span></div></div>;})}
          <button style={S.addBtn} onClick={()=>setAddingFd(true)}>+ Add FD</button>
        </div>}
      </div>}
    </div>}

    {tab==='tax'&&<div style={S.pg}>
      <div style={S.cardG}><div style={{fontSize:'10px',color:'#6A500A',textTransform:'uppercase',letterSpacing:'1.5px'}}>Regime: {taxProfile.regime==='new'?'New':'Old'} | Slab: {slabRate()}% | Income: {fmt(latestIncome)}</div></div>
      {(mfVal>0||stVal>0)&&(()=>{var ltcg=mfHoldings.filter(h=>h.type==='equity').reduce((s,h)=>s+Math.max(0,h.units*(h.currentNav||0)-h.units*(h.avgNav||0)),0)+stocks.reduce((s,h)=>s+Math.max(0,h.qty*(h.currentPrice||0)-h.qty*(h.avgPrice||0)),0),taxable=Math.max(0,ltcg-125000),tax=taxable*0.125;return<div style={S.card}><div style={S.ct}>Equity LTCG</div><Dr label="Gains" val={fmt(ltcg)}/><Dr label="Exempt" val={'\u20B91.25L'} color="#22C55E"/><Dr label="Taxable" val={fmt(taxable)} color={taxable>0?'#EF4444':'#22C55E'}/><Dr label="Tax @12.5%" val={fmt(tax)} color={tax>0?'#EF4444':'#22C55E'}/>{ltcg>0&&ltcg<125000&&<div style={{fontSize:'11px',color:'#22C55E',marginTop:'8px',padding:'8px',background:'#050F05',borderRadius:'8px'}}>Book {fmt(125000-ltcg)} more LTCG this FY tax-free!</div>}</div>;})()}
      {cryptoVal>0&&<div style={S.card}><div style={S.ct}>Crypto Tax</div><Dr label="Crypto Gains" val={fmt(Math.max(0,cryptoVal-cryptoCost))}/><Dr label="Tax @30% flat" val={fmt(Math.max(0,cryptoVal-cryptoCost)*0.3)} color="#EF4444"/><div style={{fontSize:'11px',color:'#555',marginTop:'4px'}}>No exemptions, no loss offset, 1% TDS on transfers.</div></div>}
      <div style={S.card}><div style={S.ct}>Tax Tips</div>{[['Harvest \u20B91.25L LTCG yearly','Sell & repurchase equity before March 31. Zero tax up to \u20B91.25L.'],['SGB 8-year hold','Original subscribers holding 8 years get zero capital gains tax.'],['EPF 5-year rule','10% TDS if withdrawn early. Tax-free after 5 years.'],['NPS extra \u20B950K','80CCD(1B) gives extra deduction in old regime.'],['PPF is EEE','Tax-free at deposit, interest, and withdrawal.'],['File ITR on time','Capital losses expire without filing by July 31.']].map(p=><div key={p[0]} style={{marginBottom:'8px',paddingBottom:'8px',borderBottom:'1px solid #141414'}}><div style={{fontSize:'12px',fontWeight:700,color:'#F2C94C',marginBottom:'2px'}}>{p[0]}</div><div style={{fontSize:'11px',color:'#444',lineHeight:1.5}}>{p[1]}</div></div>)}</div>
    </div>}

    <div style={S.nav}>{TABS.map(t=><div key={t.k} style={S.ni(tab===t.k)} onClick={()=>{setTab(t.k);setSubTab('portfolio');setEditId(null);}}><span style={{fontSize:'18px'}}>{t.i}</span><span style={S.nl(tab===t.k)}>{t.l}</span></div>)}</div>
  </div>);
}

ReactDOM.createRoot(document.getElementById('root')).render(<WealthApp/>);
</script>
</body>
</html>
