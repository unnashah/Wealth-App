// XIRR calculation (Newton's method)
const xirr=(cashflows)=>{
  // cashflows: [{amount, date}] negative=investment, positive=redemption
  if(!cashflows||cashflows.length<2)return 0;
  const days=cashflows.map(cf=>daysBetween(cashflows[0].date,cf.date));
  let rate=0.1;
  for(let i=0;i<100;i++){
    let fv=0,dfv=0;
    for(let j=0;j<cashflows.length;j++){
      const t=days[j]/365;
      fv+=cashflows[j].amount*Math.pow(1+rate,-t);
      dfv+=-t*cashflows[j].amount*Math.pow(1+rate,-t-1);
    }
    if(Math.abs(dfv)<1e-10)break;
    const newRate=rate-fv/dfv;
    if(Math.abs(newRate-rate)<1e-7)return newRate*100;
    rate=newRate;
    if(rate<-0.99)rate=-0.99;
  }
  return rate*100;
};

function NWChart({history}){
  if(!history||history.length<2)return null;
  var data=history.slice(-90),vals=data.map(d=>d.nw),minV=Math.min(...vals),maxV=Math.max(...vals),range=maxV-minV||1,W=340,H=120,pY=10;

  var first=data[0],last=data[data.length-1],ch=last.nw-first.nw,chP=first.nw>0?((ch/first.nw)*100).toFixed(1):'0',up=ch>=0;
  return(<div style={{background:'#FFFFFF',border:'1px solid #E5E7EB',borderRadius:'14px',padding:'14px',marginBottom:'10px'}}>

}
 
function AllocPie({segments}){
  if(!segments||!segments.length)return null;
  const total=segments.reduce((s,x)=>s+x.v,0);if(total<=0)return null;
  const colors=['#D4A017','#22C55E','#3B82F6','#EF4444','#A855F7','#F97316','#06B6D4','#EC4899'];
  let cum=0;
  return(<div style={{background:'#FFFFFF',border:'1px solid #E5E7EB',borderRadius:'14px',padding:'14px',marginBottom:'10px'}}>
    <div style={{fontSize:'10px',fontWeight:800,color:'#B8860B',letterSpacing:'2px',textTransform:'uppercase',marginBottom:'10px'}}>Asset Allocation</div>
    <div style={{display:'flex',gap:'12px',alignItems:'center'}}>
      <svg viewBox="0 0 36 36" style={{width:'100px',height:'100px',flexShrink:0}}>
        {segments.map((seg,i)=>{const pctVal=(seg.v/total)*100;const dash=pctVal;const offset=100-cum;cum+=pctVal;return<circle key={i} cx="18" cy="18" r="15.9" fill="none" stroke={colors[i%colors.length]} strokeWidth="3.5" strokeDasharray={dash+' '+(100-dash)} strokeDashoffset={offset} transform="rotate(-90 18 18)"/>;})}</svg>

}

      <div style={S.nav}>{TABS.map(t=><div key={t.k} style={S.ni(tab===t.k)} onClick={()=>{setTab(t.k);setSubTab(t.k==='assets'?'metals':t.k==='insights'?'alloc':'overview');}}><span style={{fontSize:'18px'}}>{t.i}</span><span style={S.nl(tab===t.k)}>{t.l}</span></div>)}</div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<WealthApp/>);
</script>
