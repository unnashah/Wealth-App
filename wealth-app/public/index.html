<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="theme-color" content="#080808"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Wealth"/>
<link rel="manifest" href="/manifest.json"/>
<link rel="icon" href="/icon.svg"/>
<link rel="apple-touch-icon" href="/icon.svg"/>
<title>Wealth Dashboard</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#080808;font-family:system-ui,sans-serif;-webkit-tap-highlight-color:transparent}input,button,textarea{font-family:inherit}::-webkit-scrollbar{display:none}</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;

const fmt = (n) => { if (!n && n !== 0) return '—'; const num = parseFloat(n); if (isNaN(num)) return '—'; if (num >= 10000000) return '₹'+(num/10000000).toFixed(2)+'Cr'; if (num >= 100000) return '₹'+(num/100000).toFixed(2)+'L'; if (num >= 1000) return '₹'+(num/1000).toFixed(1)+'K'; return '₹'+num.toFixed(0); };
const f = (n) => parseFloat(n) || 0;
const pct = (c, b) => b > 0 ? (((c-b)/b)*100).toFixed(1) : '0.0';
const gc = (c, b) => c >= b ? '#22C55E' : '#EF4444';
const daysBetween = (a, b) => Math.floor((new Date(b) - new Date(a)) / 86400000);
const daysLeft = (d) => daysBetween(new Date().toISOString().split('T')[0], d);
const daysHeld = (d) => daysBetween(d, new Date().toISOString().split('T')[0]);
const fmtDate = (d) => d ? new Date(d).toLocaleDateString('en-IN', {day:'numeric',month:'short',year:'numeric'}) : '—';
const calcFD = (p, r, days, freq=4) => f(p) * Math.pow(1 + f(r)/100/freq, freq * days/365);

// ── localStorage helpers ──
const load = (key, fallback) => { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch { return fallback; } };
const save = (key, val) => { try { localStorage.setItem(key, JSON.stringify(val)); } catch {} };

function WealthApp() {
  const [tab, setTab] = useState('home');
  const [subTab, setSubTab] = useState('portfolio');

  const [prices, setPrices] = useState(() => load('w_prices', { gold24k: 9500, gold22k: 8700, gold18k: 7125, silver: 105, updated: null }));
  const [editingPrices, setEditingPrices] = useState(false);
  const [tempPrices, setTempPrices] = useState({});

  const [metals, setMetals] = useState(() => load('w_metals', { gold24k: '', gold22k: '', gold18k: '', silver: '' }));
  const [taxProfile, setTaxProfile] = useState(() => load('w_tax', { income: '', regime: 'new' }));
  const [sgb, setSgb] = useState(() => load('w_sgb', { grams: '', purchasePrice: '', purchaseType: 'primary', purchaseDate: '' }));
  const [nps, setNps] = useState(() => load('w_nps', { balance: '', age: '' }));
  const [ppf, setPpf] = useState(() => load('w_ppf', { balance: '', openYear: '' }));
  const [epf, setEpf] = useState(() => load('w_epf', { balance: '', serviceYears: '' }));
  const [mfHoldings, setMfHoldings] = useState(() => load('w_mf', []));
  const [stocks, setStocks] = useState(() => load('w_stocks', []));
  const [fds, setFds] = useState(() => load('w_fds', []));

  const [mfSearch, setMfSearch] = useState('');
  const [mfResults, setMfResults] = useState([]);
  const [searching, setSearching] = useState(false);
  const [newMf, setNewMf] = useState({ schemeCode: '', schemeName: '', units: '', avgNav: '', type: 'equity' });
  const [addingMf, setAddingMf] = useState(false);
  const [newStock, setNewStock] = useState({ symbol: '', name: '', qty: '', avgPrice: '' });
  const [addingStock, setAddingStock] = useState(false);
  const [loadingStocks, setLoadingStocks] = useState(false);
  const [selectedFd, setSelectedFd] = useState(null);
  const [addingFd, setAddingFd] = useState(false);
  const [fdForm, setFdForm] = useState({ bank:'', principal:'', rate:'', startDate:'', maturityDate:'', tenureMonths:'', compounding:'4', seniorCitizen:false, autoRenew:false, notes:'' });
  const [wdDate, setWdDate] = useState('');
  const [penalty, setPenalty] = useState('1');

  // ── Save helpers ──
  const savePrices = (p) => { setPrices(p); save('w_prices', p); };
  const saveMetals = (m) => { setMetals(m); save('w_metals', m); };
  const saveTax = (t) => { setTaxProfile(t); save('w_tax', t); };
  const saveSgb = (s) => { setSgb(s); save('w_sgb', s); };
  const saveNps = (n) => { setNps(n); save('w_nps', n); };
  const savePpf = (p) => { setPpf(p); save('w_ppf', p); };
  const saveEpf = (e) => { setEpf(e); save('w_epf', e); };
  const saveMf = (m) => { setMfHoldings(m); save('w_mf', m); };
  const saveStocks = (s) => { setStocks(s); save('w_stocks', s); };
  const saveFds = (f) => { setFds(f); save('w_fds', f); };

  // ── MF NAV from mfapi.in (free, no key) ──
  const fetchNAV = async (code) => {
    try { const r = await fetch('https://api.mfapi.in/mf/'+code+'/latest'); const d = await r.json(); if (d && d.data && d.data[0]) return { nav: parseFloat(d.data[0].nav), date: d.data[0].date }; } catch {} return null;
  };

  const searchMF = async (q) => {
    if (!q || q.length < 2) { setMfResults([]); return; }
    setSearching(true);
    try { const r = await fetch('https://api.mfapi.in/mf/search?q='+encodeURIComponent(q)); const d = await r.json(); setMfResults((Array.isArray(d)?d:[]).slice(0,7)); } catch { setMfResults([]); }
    setSearching(false);
  };

  // ── Stock prices from Vercel API route ──
  const fetchStockPrices = async (list) => {
    if (!list.length) return list;
    try {
      const symbols = list.map(s => s.symbol).join(',');
      const r = await fetch('/api/stocks?symbols='+encodeURIComponent(symbols));
      const arr = await r.json();
      if (Array.isArray(arr)) {
        const map = {};
        arr.forEach(p => { if (p.symbol) map[p.symbol.toUpperCase()] = p; });
        return list.map(s => {
          const found = map[s.symbol.toUpperCase()];
          return found && found.price ? {...s, currentPrice: found.price, change: found.change} : s;
        });
      }
    } catch {}
    return list;
  };

  const addMf = async () => {
    if (!newMf.schemeCode || !newMf.units) return;
    const nav = await fetchNAV(newMf.schemeCode);
    const h = { id: Date.now(), schemeCode: newMf.schemeCode, schemeName: newMf.schemeName, units: f(newMf.units), avgNav: f(newMf.avgNav), type: newMf.type, currentNav: nav ? nav.nav : null, navDate: nav ? nav.date : null };
    const updated = [...mfHoldings, h];
    saveMf(updated);
    setNewMf({ schemeCode:'', schemeName:'', units:'', avgNav:'', type:'equity' }); setMfSearch(''); setMfResults([]); setAddingMf(false);
  };

  const addStock = async () => {
    if (!newStock.symbol || !newStock.qty) return;
    setLoadingStocks(true);
    const h = { id: Date.now(), symbol: newStock.symbol.toUpperCase(), name: newStock.name || newStock.symbol.toUpperCase(), qty: f(newStock.qty), avgPrice: f(newStock.avgPrice), currentPrice: null, change: null };
    const withPrice = await fetchStockPrices([h]);
    const updated = [...stocks, withPrice[0]];
    saveStocks(updated);
    setNewStock({ symbol:'', name:'', qty:'', avgPrice:'' }); setAddingStock(false); setLoadingStocks(false);
  };

  const refreshAll = async () => {
    if (mfHoldings.length) {
      const u = await Promise.all(mfHoldings.map(async h => { const n = await fetchNAV(h.schemeCode); return n ? {...h, currentNav: n.nav, navDate: n.date} : h; }));
      saveMf(u);
    }
    if (stocks.length) {
      setLoadingStocks(true);
      const u = await fetchStockPrices(stocks);
      saveStocks(u);
      setLoadingStocks(false);
    }
  };

  // ── Computed ──
  const metalVal = () => ['gold24k','gold22k','gold18k','silver'].reduce((s,k) => s + f(metals[k]) * (prices[k]||0), 0);
  const sgbVal = () => f(sgb.grams) * (prices.gold24k || 0);
  const mfVal = mfHoldings.reduce((s, h) => s + h.units * (h.currentNav||0), 0);
  const mfCost = mfHoldings.reduce((s, h) => s + h.units * (h.avgNav||0), 0);
  const stVal = stocks.reduce((s, h) => s + h.qty * (h.currentPrice||0), 0);
  const stCost = stocks.reduce((s, h) => s + h.qty * (h.avgPrice||0), 0);
  const fdVal = fds.reduce((s, fd) => { const days = daysBetween(fd.startDate, fd.maturityDate); return s + calcFD(fd.principal, fd.rate, days, fd.compounding); }, 0);
  const totalNW = () => metalVal() + sgbVal() + f(nps.balance) + f(ppf.balance) + f(epf.balance) + mfVal + stVal + fdVal;

  const slabRate = () => {
    const inc = f(taxProfile.income);
    if (taxProfile.regime === 'new') { if (inc<=400000) return 0; if (inc<=800000) return 5; if (inc<=1200000) return 10; if (inc<=1600000) return 15; if (inc<=2000000) return 20; if (inc<=2400000) return 25; return 30; }
    if (inc<=250000) return 0; if (inc<=500000) return 5; if (inc<=1000000) return 20; return 30;
  };

  // ── STYLES ──
  const S = {
    wrap: { background:'#080808', minHeight:'100vh', maxWidth:'400px', margin:'0 auto', fontFamily:'system-ui,sans-serif', paddingBottom:'72px' },
    hdr: { background:'#080808', borderBottom:'1px solid #1A1A1A', padding:'14px 16px 10px', position:'sticky', top:0, zIndex:20 },
    hdate: { fontSize:'9px', letterSpacing:'2px', textTransform:'uppercase', color:'#6A500A', marginBottom:'1px' },
    htitle: { fontSize:'19px', fontWeight:800, color:'#F2C94C', margin:0 },
    hsub: { fontSize:'10px', color:'#2A2A2A', marginTop:'1px' },
    pg: { padding:'12px' },
    card: { background:'#0F0F0F', border:'1px solid #1C1C1C', borderRadius:'14px', padding:'14px', marginBottom:'10px' },
    cardG: { background:'#0D0B00', border:'1px solid #6A500A', borderRadius:'14px', padding:'14px', marginBottom:'10px' },
    ct: { fontSize:'10px', fontWeight:800, color:'#F2C94C', marginBottom:'10px', letterSpacing:'2px', textTransform:'uppercase' },
    lbl: { fontSize:'10px', fontWeight:600, color:'#3A3A3A', textTransform:'uppercase', letterSpacing:'1px', marginBottom:'4px' },
    inp: { width:'100%', background:'#141414', border:'1px solid #222', borderRadius:'8px', padding:'9px 11px', fontSize:'14px', color:'#F2C94C', outline:'none', boxSizing:'border-box', fontFamily:'inherit' },
    ta: { width:'100%', background:'#141414', border:'1px solid #222', borderRadius:'8px', padding:'9px 11px', fontSize:'13px', color:'#F2C94C', outline:'none', resize:'none', boxSizing:'border-box', fontFamily:'inherit' },
    chip: function(a){ return { padding:'6px 12px', borderRadius:'20px', fontSize:'11px', fontWeight:700, cursor:'pointer', border:a?'none':'1px solid #222', background:a?'#F2C94C':'transparent', color:a?'#080808':'#555' }; },
    addBtn: { width:'100%', padding:'11px', background:'#F2C94C', color:'#080808', border:'none', borderRadius:'10px', fontSize:'13px', fontWeight:800, cursor:'pointer', marginTop:'6px' },
    smBtn: { padding:'7px 14px', background:'#F2C94C', color:'#080808', border:'none', borderRadius:'8px', fontSize:'11px', fontWeight:800, cursor:'pointer' },
    refreshBtn: { padding:'5px 11px', background:'transparent', border:'1px solid #6A500A', borderRadius:'8px', color:'#F2C94C', fontSize:'10px', fontWeight:700, cursor:'pointer' },
    dr: { display:'flex', justifyContent:'space-between', alignItems:'center', padding:'6px 0', borderBottom:'1px solid #141414' },
    row2: { display:'flex', gap:'8px', marginBottom:'8px' },
    holdCard: { background:'#141414', border:'1px solid #1C1C1C', borderRadius:'12px', padding:'12px', marginBottom:'8px' },
    srRow: { padding:'10px 12px', borderBottom:'1px solid #1C1C1C', cursor:'pointer', fontSize:'11px', color:'#AAA' },
    tabBtn: function(a){ return { padding:'6px 13px', borderRadius:'20px', fontSize:'11px', fontWeight:700, cursor:'pointer', border:'none', background:a?'#F2C94C':'#141414', color:a?'#080808':'#555', whiteSpace:'nowrap', flexShrink:0 }; },
    nav: { position:'fixed', bottom:0, left:'50%', transform:'translateX(-50%)', width:'100%', maxWidth:'400px', background:'#080808', borderTop:'1px solid #1A1A1A', display:'flex', justifyContent:'space-around', padding:'8px 0 12px', zIndex:20 },
    ni: function(a){ return { display:'flex', flexDirection:'column', alignItems:'center', gap:'2px', cursor:'pointer', opacity:a?1:0.28 }; },
    nl: function(a){ return { fontSize:'8px', fontWeight:800, color:a?'#F2C94C':'#555', textTransform:'uppercase' }; },
  };

  const Dr = ({ label, val, color, bold }) => (
    <div style={S.dr}><span style={{fontSize:'12px',color:'#555'}}>{label}</span><span style={{fontSize:'12px',fontWeight:bold?800:600,color:color||'#F2C94C'}}>{val}</span></div>
  );

  // ══════════ HOME TAB ══════════
  const HomeTab = () => {
    const nw = totalNW();
    const breakdown = [
      { l:'🥇 Gold & Silver', v: metalVal() },
      { l:'📜 SGB', v: sgbVal() },
      { l:'🏛️ NPS', v: f(nps.balance) },
      { l:'💰 PPF', v: f(ppf.balance) },
      { l:'👔 EPF', v: f(epf.balance) },
      { l:'📈 Mutual Funds', v: mfVal },
      { l:'📊 Stocks', v: stVal },
      { l:'🏦 FDs', v: fdVal },
    ].filter(x => x.v > 0);
    return (
      <div style={S.pg}>
        <div style={{...S.cardG, textAlign:'center', padding:'20px 14px'}}>
          <div style={{fontSize:'9px',color:'#6A500A',letterSpacing:'2px',textTransform:'uppercase',marginBottom:'4px'}}>Total Net Worth</div>
          <div style={{fontSize:'34px',fontWeight:800,color:'#F2C94C'}}>{fmt(nw) || '₹0'}</div>
          <div style={{fontSize:'9px',color:'#2A2A2A',marginTop:'4px'}}>{new Date().toLocaleDateString('en-IN',{day:'numeric',month:'long',year:'numeric'})}</div>
          {prices.updated && <div style={{fontSize:'9px',color:'#2A2A2A',marginTop:'2px'}}>Prices updated {prices.updated}</div>}
          <div style={{display:'flex',gap:'8px',justifyContent:'center',marginTop:'10px'}}>
            <button style={S.refreshBtn} onClick={refreshAll}>↻ Refresh MF & Stock Prices</button>
          </div>
        </div>

        {breakdown.length > 0 && (
          <div style={S.card}>
            <div style={S.ct}>Breakdown</div>
            {breakdown.map(function(item){
              return (
                <div key={item.l}>
                  <div style={S.dr}><span style={{fontSize:'13px',color:'#777'}}>{item.l}</span><span style={{fontSize:'13px',fontWeight:700,color:'#F2C94C'}}>{fmt(item.v)}</span></div>
                  <div style={{height:'3px',background:'#141414',borderRadius:'2px',margin:'2px 0 4px'}}>
                    <div style={{height:'100%',width:Math.min(100,(item.v/nw)*100)+'%',background:'#F2C94C',borderRadius:'2px',opacity:0.5}}/>
                  </div>
                </div>
              );
            })}
          </div>
        )}

        <div style={S.card}>
          <div style={S.ct}>Tax Profile</div>
          <div style={{...S.row2,marginBottom:'10px'}}>
            <button style={S.chip(taxProfile.regime==='new')} onClick={function(){var u={...taxProfile,regime:'new'};saveTax(u);}}>New Regime</button>
            <button style={S.chip(taxProfile.regime==='old')} onClick={function(){var u={...taxProfile,regime:'old'};saveTax(u);}}>Old Regime</button>
          </div>
          <div style={S.lbl}>Annual Income (₹)</div>
          <input style={S.inp} type="number" placeholder="e.g. 1500000" value={taxProfile.income}
            onChange={function(e){var u={...taxProfile,income:e.target.value};saveTax(u);}}/>
          {taxProfile.income && (
            <div style={{marginTop:'8px',padding:'10px',background:'#141414',borderRadius:'8px',display:'flex',gap:'8px',flexWrap:'wrap'}}>
              {[['Slab',slabRate()+'%'],['STCG','20%'],['LTCG','12.5%'],['LTCG Exempt','₹1.25L/yr']].map(function(pair){
                return <div key={pair[0]} style={{background:'#1A1A1A',borderRadius:'6px',padding:'4px 8px',fontSize:'11px'}}>
                  <span style={{color:'#555'}}>{pair[0]}: </span><span style={{color:'#F2C94C',fontWeight:700}}>{pair[1]}</span>
                </div>;
              })}
            </div>
          )}
        </div>

        {breakdown.length === 0 && (
          <div style={{...S.card,textAlign:'center',padding:'28px'}}>
            <div style={{fontSize:'28px',marginBottom:'8px'}}>💎</div>
            <div style={{fontSize:'13px',color:'#444'}}>Add your investments across the tabs below to see your total net worth here.</div>
          </div>
        )}
      </div>
    );
  };

  // ══════════ METALS TAB ══════════
  const MetalsTab = () => {
    const startEdit = () => { setTempPrices({gold24k:prices.gold24k,gold22k:prices.gold22k,gold18k:prices.gold18k,silver:prices.silver}); setEditingPrices(true); };
    const saveEdit = () => { savePrices({...tempPrices,updated:new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})+' '+new Date().toLocaleDateString('en-IN',{day:'numeric',month:'short'})}); setEditingPrices(false); };

    return (
      <div style={S.pg}>
        <div style={S.cardG}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'10px'}}>
            <div style={S.ct}>Prices — India (per gram)</div>
            {!editingPrices ? <button style={S.refreshBtn} onClick={startEdit}>✏️ Update</button> : <button style={S.smBtn} onClick={saveEdit}>✓ Save</button>}
          </div>
          {editingPrices ? (
            <div>
              {[['gold24k','🥇 Gold 24K'],['gold22k','🥈 Gold 22K'],['gold18k','🏅 Gold 18K'],['silver','🪙 Silver']].map(function(pair){
                return <div key={pair[0]} style={{marginBottom:'6px'}}>
                  <div style={S.lbl}>{pair[1]} (₹/gram)</div>
                  <input style={S.inp} type="number" value={tempPrices[pair[0]]||''} onChange={function(e){setTempPrices(function(p){return {...p,[pair[0]]:parseFloat(e.target.value)||0};});}}/>
                </div>;
              })}
              <div style={{fontSize:'10px',color:'#6A500A',marginTop:'6px'}}>💡 Google "gold rate today India" for latest prices</div>
            </div>
          ) : (
            <div>
              {[['🥇 Gold 24K',prices.gold24k],['🥈 Gold 22K',prices.gold22k],['🏅 Gold 18K',prices.gold18k],['🪙 Silver',prices.silver]].map(function(pair){
                return <Dr key={pair[0]} label={pair[0]} val={'₹'+(pair[1]||0).toLocaleString('en-IN')+'/g'}/>;
              })}
              {prices.updated && <div style={{fontSize:'9px',color:'#2A2A2A',marginTop:'6px'}}>Updated {prices.updated}</div>}
            </div>
          )}
        </div>

        <div style={S.card}>
          <div style={S.ct}>My Holdings</div>
          {[['gold24k','🥇 24K Gold'],['gold22k','🥈 22K Gold'],['gold18k','🏅 18K Gold'],['silver','🪙 Silver']].map(function(pair){
            var key=pair[0], label=pair[1];
            var val = f(metals[key]) * (prices[key]||0);
            return (
              <div key={key} style={{marginBottom:'10px'}}>
                <div style={S.lbl}>{label} (grams)</div>
                <div style={{display:'flex',gap:'8px',alignItems:'center'}}>
                  <input style={{...S.inp,flex:1}} type="number" placeholder="0" value={metals[key]}
                    onChange={function(e){var m={...metals,[key]:e.target.value};saveMetals(m);}}/>
                  {metals[key] && <span style={{fontSize:'13px',color:'#F2C94C',fontWeight:700,minWidth:'70px',textAlign:'right'}}>{fmt(val)}</span>}
                </div>
              </div>
            );
          })}
          {metalVal()>0 && (
            <div style={{marginTop:'6px',padding:'12px',background:'#141414',borderRadius:'10px',textAlign:'center'}}>
              <div style={{fontSize:'9px',color:'#3A3A3A',letterSpacing:'1px',marginBottom:'2px'}}>TOTAL METALS VALUE</div>
              <div style={{fontSize:'22px',fontWeight:800,color:'#F2C94C'}}>{fmt(metalVal())}</div>
            </div>
          )}
        </div>

        <div style={S.card}>
          <div style={S.ct}>📜 Sovereign Gold Bonds</div>
          <div style={{...S.row2,marginBottom:'8px'}}>
            <button style={S.chip(sgb.purchaseType==='primary')} onClick={function(){saveSgb({...sgb,purchaseType:'primary'});}}>🏦 Primary</button>
            <button style={S.chip(sgb.purchaseType==='secondary')} onClick={function(){saveSgb({...sgb,purchaseType:'secondary'});}}>📊 Secondary</button>
          </div>
          {[['grams','Units (grams)'],['purchasePrice','Purchase price/gram (₹)']].map(function(pair){
            return <div key={pair[0]} style={{marginBottom:'8px'}}>
              <div style={S.lbl}>{pair[1]}</div>
              <input style={S.inp} type="number" placeholder="0" value={sgb[pair[0]]}
                onChange={function(e){var u={...sgb,[pair[0]]:e.target.value};saveSgb(u);}}/>
            </div>;
          })}
          <div style={S.lbl}>Purchase Date</div>
          <input style={{...S.inp,marginBottom:'8px'}} type="date" value={sgb.purchaseDate}
            onChange={function(e){saveSgb({...sgb,purchaseDate:e.target.value});}}/>
          {sgb.grams && prices.gold24k && (
            <div style={{padding:'10px',background:'#141414',borderRadius:'10px',marginTop:'4px'}}>
              <Dr label="Current value" val={fmt(sgbVal())}/>
              {sgb.purchasePrice && <Dr label="Gain/Loss" val={fmt(sgbVal()-f(sgb.purchasePrice)*f(sgb.grams))} color={sgbVal()>=f(sgb.purchasePrice)*f(sgb.grams)?'#22C55E':'#EF4444'}/>}
              {sgb.purchaseDate && (function(){
                var yrs = (new Date()-new Date(sgb.purchaseDate))/(365.25*864e5);
                if (sgb.purchaseType==='primary' && yrs>=8) return <div style={{fontSize:'11px',color:'#22C55E',marginTop:'6px'}}>✅ Zero tax at maturity</div>;

              <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:'8px'}}>
                <div><div style={{fontSize:'14px',fontWeight:800,color:'#F2C94C'}}>{fd.bank}</div><div style={{fontSize:'11px',color:'#3A3A3A',marginTop:'2px'}}>{fd.rate}% · {fmt(fd.principal)}</div></div>
                <div style={{textAlign:'right'}}><div style={{fontSize:'15px',fontWeight:800,color:'#F2C94C'}}>{fmt(mat)}</div><div style={{fontSize:'10px',color:'#22C55E'}}>+{fmt(mat-fd.principal)}</div></div>
              </div>
              {!isMatured && <div style={{height:'3px',background:'#1A1A1A',borderRadius:'2px',marginBottom:'6px'}}><div style={{height:'100%',width:prog+'%',background:isUrgent?'#EF4444':'#22C55E',borderRadius:'2px',opacity:0.7}}/></div>}
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                <div style={{fontSize:'10px',color:'#3A3A3A'}}>{fmtDate(fd.startDate)} → {fmtDate(fd.maturityDate)}</div>
                <div style={{fontSize:'10px',fontWeight:700,color:isMatured?'#888':isUrgent?'#EF4444':'#22C55E'}}>{isMatured?'✓ Matured':left+'d left'}</div>
              </div>
            </div>
          );
        })}
        <button style={S.addBtn} onClick={function(){setAddingFd(true);}}>+ Add Fixed Deposit</button>
      </div>
    );
  };

  // ══════════ TAX TAB ══════════
  const TaxTab = () => {
    var ltcgGain = mfHoldings.filter(function(h){return h.type==='equity';}).reduce(function(s,h){return s+Math.max(0,h.units*(h.currentNav||0)-h.units*(h.avgNav||0));},0)+stocks.reduce(function(s,h){return s+Math.max(0,h.qty*(h.currentPrice||0)-h.qty*(h.avgPrice||0));},0);
    var taxableGain = Math.max(0, ltcgGain-125000);
    var ltcgTax = taxableGain * 0.125;
    return (
      <div style={S.pg}>
        <div style={S.cardG}>
          <div style={{fontSize:'10px',color:'#6A500A',letterSpacing:'1.5px',textTransform:'uppercase',marginBottom:'6px'}}>Regime: {taxProfile.regime==='new'?'New':'Old'} · Slab: {slabRate()}%</div>
          <div style={{display:'flex',gap:'8px',flexWrap:'wrap'}}>
            {[['STCG','20%'],['LTCG','12.5%'],['LTCG Exempt','₹1.25L/yr']].map(function(pair){
              return <div key={pair[0]} style={{background:'#1A1A0A',borderRadius:'6px',padding:'5px 9px',fontSize:'11px'}}>
                <span style={{color:'#6A500A'}}>{pair[0]}: </span><span style={{color:'#F2C94C',fontWeight:700}}>{pair[1]}</span>
              </div>;
            })}
          </div>
        </div>
        {(mfVal>0||stVal>0) && (
          <div style={S.card}>
            <div style={S.ct}>📈 Equity LTCG</div>
            <Dr label="Long-term gains" val={fmt(ltcgGain)}/>
            <Dr label="Tax-free limit" val="₹1.25L" color="#22C55E"/>
            <Dr label="Taxable" val={fmt(taxableGain)} color={taxableGain>0?'#EF4444':'#22C55E'}/>
            <Dr label="LTCG tax @ 12.5%" val={fmt(ltcgTax)} color={ltcgTax>0?'#EF4444':'#22C55E'}/>
            {ltcgGain>0 && ltcgGain<125000 && <div style={{fontSize:'11px',color:'#22C55E',marginTop:'8px',padding:'8px',background:'#050F05',borderRadius:'8px'}}>💡 Book {fmt(125000-ltcgGain)} more in LTCG this FY — completely tax-free! Sell and repurchase to reset cost basis.</div>}
          </div>
        )}
        <div style={S.card}>
          <div style={S.ct}>💡 Smart Tax Moves</div>
          {[['Harvest ₹1.25L LTCG yearly','Sell equity with up to ₹1.25L long-term gain annually. Zero tax. Do before March 31.'],
            ['SGB hold to maturity','Original subscribers holding 8 years get zero capital gains tax.'],
            ['EPF 5-year rule','Don\'t withdraw before 5 years — 10% TDS applies. After 5 years: tax-free.'],
            ['PPF: avoid early break','1% interest penalty on premature closure. Partial withdrawal from year 6 is smarter.'],
            ['File ITR on time','Capital losses expire if ITR not filed by July 31. File even if no tax due.'],
          ].map(function(pair){
            return <div key={pair[0]} style={{marginBottom:'8px',paddingBottom:'8px',borderBottom:'1px solid #141414'}}>
              <div style={{fontSize:'12px',fontWeight:700,color:'#F2C94C',marginBottom:'2px'}}>{pair[0]}</div>
              <div style={{fontSize:'11px',color:'#444',lineHeight:1.5}}>{pair[1]}</div>
            </div>;
          })}
        </div>
      </div>
    );
  };

  var TABS = [
    {k:'home',i:'💎',l:'Wealth'},
    {k:'metals',i:'🥇',l:'Metals'},
    {k:'markets',i:'📈',l:'Markets'},
    {k:'fds',i:'🏦',l:'FDs'},
    {k:'tax',i:'✂️',l:'Tax'},
  ];
  var titles = {home:'💎 Net Worth',metals:'🥇 Gold & Silver',markets:'📈 Markets',fds:'🏦 Fixed Deposits',tax:'✂️ Tax Planner'};

  return (
    <div style={S.wrap}>
      <div style={S.hdr}>
        <div style={S.hdate}>{new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</div>
        <h1 style={S.htitle}>{titles[tab]}</h1>
      </div>
      {tab==='home' && <HomeTab/>}
      {tab==='metals' && <MetalsTab/>}
      {tab==='markets' && <MarketsTab/>}
      {tab==='fds' && <FDTab/>}
      {tab==='tax' && <TaxTab/>}
      <div style={S.nav}>
        {TABS.map(function(t){
          return <div key={t.k} style={S.ni(tab===t.k)} onClick={function(){setTab(t.k);setSubTab('portfolio');}}>
            <span style={{fontSize:'18px'}}>{t.i}</span>
            <span style={S.nl(tab===t.k)}>{t.l}</span>
          </div>;
        })}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<WealthApp/>);
</script>
</body>
</html>
